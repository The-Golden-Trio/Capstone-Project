# Dịch vụ phụ khi chạy JobQuest ở máy dev (khác compose Overleaf trong cùng thư mục).
#   docker compose -f infra/local/dev-stack.yml up -d
# Redis: hàng đợi job (BullMQ) và pub/sub cho luồng sự kiện /api/v1/stream.
services:
  redis:
    image: redis:7.4-alpine
    container_name: jobquest-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  # Postgres dev riêng cho máy này: thử migration và seed staff mà không đụng
  # DB dùng chung của nhóm. Trỏ DIRECT_URL và DATABASE_URL vào đây khi cần:
  #   postgresql://jobquest:jobquest@localhost:5433/jobquest
  postgres:
    image: postgres:16-alpine
    container_name: jobquest-postgres
    environment:
      POSTGRES_USER: jobquest
      POSTGRES_PASSWORD: jobquest
      POSTGRES_DB: jobquest
    ports:
      - '5433:5432'
    volumes:
      - jobquest-pg:/var/lib/postgresql/data
    restart: unless-stopped

  # Hộp thư giả: API gửi mail qua SMTP_URL=smtp://localhost:1025, xem ở http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: jobquest-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    restart: unless-stopped

  # Kho object tương thích S3 cho asset (StorageService).
  # Console: http://localhost:9001/rustfs/console/ (jobquest / jobquest-dev).
  # Dùng RustFS vì image minio/minio và minio/mc đã bị gỡ khỏi Docker Hub.
  rustfs:
    image: rustfs/rustfs:1.0.5
    container_name: jobquest-rustfs
    environment:
      RUSTFS_ACCESS_KEY: jobquest
      RUSTFS_SECRET_KEY: jobquest-dev
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - jobquest-rustfs:/data
    restart: unless-stopped

  # Tạo bucket một lần rồi thoát.
  rustfs-init:
    image: amazon/aws-cli:2.40.2
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: jobquest
      AWS_SECRET_ACCESS_KEY: jobquest-dev
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket jobquest 2>/dev/null
      || aws --endpoint-url http://rustfs:9000 s3 mb s3://jobquest; do sleep 1; done"
    restart: 'no'

volumes:
  jobquest-pg:
  jobquest-rustfs:
