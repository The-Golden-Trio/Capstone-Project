          type: string
          format: uuid
    post:
      tags:
        - Admin
      operationId: rerunAiJob
      summary: Re-run a failed AI job
      x-roles:
        - SYSTEM_ADMIN
      x-fr:
        - FR-43
      responses:
        '202':
          description: New job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
      x-screens:
        - A05 Operations monitor
  /admin/app-feedback:
    get:
      tags:
        - Admin
      operationId: listAppFeedback
      summary: List app feedback
      x-roles:
        - SYSTEM_ADMIN
      x-fr:
        - FR-20
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - NEW
              - HANDLED
      responses:
        '200':
          description: Feedback, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppFeedback'
      x-screens:
        - A06 App feedback inbox
  /admin/app-feedback/{feedbackId}:
    parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Admin
      operationId: markAppFeedback
      summary: Mark feedback as handled
      x-roles:
        - SYSTEM_ADMIN
      x-fr:
        - FR-20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAppFeedbackInput'
      responses:
        '200':
          description: Feedback updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppFeedback'
      x-screens:
        - A06 App feedback inbox
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OccupationId:
      name: occupationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LevelNo:
      name: levelNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BuildId:
      name: buildId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Missing, expired or wrong credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description:
        Role or occupation assignment does not allow this (codes ACCOUNT_DISABLED, NOT_ASSIGNED, LEVEL_LOCKED,
        REVIEWER_IS_AUTHOR)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description:
        State conflict (codes INVALID_TRANSITION, ACTIVE_SCENARIO_EXISTS, SCENARIO_UNAVAILABLE, DOMAIN_NOT_EMPTY,
        ALREADY_RATED, EMAIL_TAKEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Token expired or already used
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The resource changed since it was read (If-Match mismatch)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description:
        Request breaks a rule (codes ANSWER_INVALID, CHECKS_FAILED, CRITERIA_MISSING, TASK_TYPE_NOT_ALLOWED, MODEL_FAMILIES_OVERLAP,
        REVIEWER_IS_AUTHOR)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          examples:
            - SCENARIO_UNAVAILABLE
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
    Page:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type:
            - string
            - 'null'
    JobAccepted:
      type: object
      required:
        - jobId
      properties:
        jobId:
          type: string
          format: uuid
        answerId:
          type: string
          format: uuid
        streamEvent:
          type: string
          description: Event type that will carry the result
    Role:
      type: string
      enum:
        - EXPLORER
        - DOMAIN_EXPERT
        - CONTENT_ADMIN
        - SYSTEM_ADMIN
    ScenarioStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - IN_REVIEW
        - APPROVED
        - IN_PLAYTEST
        - READY
        - PUBLISHED
        - RETIRED
    TaskType:
      type: string
      enum:
        - FREE_TEXT
        - CHOICE
        - ORDERING
        - PRIORITIZING
    RiasecType:
      type: string
      enum:
        - R
        - I
        - A
        - S
        - E
        - C
    ReferenceSource:
      type: string
      enum:
        - ONET
        - ESCO
    Score:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: Rubric level (D-116) — 0 not yet, 1 meets, 2 done well
    ScoreOrNotApplicable:
      description: Rubric level, or null when the criterion does not apply; null levels are left out of averages (D-116)
      anyOf:
        - $ref: '#/components/schemas/Score'
        - type: 'null'
    RegisterInput:
      type: object
      required:
        - email
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          maxLength: 80
    SignInInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Session:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds
        user:
          $ref: '#/components/schemas/Me'
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        hasGoogle:
          type: boolean
        quizDone:
          type: boolean
        points:
          type: object
          properties:
            expertise:
              type: integer
            softSkill:
              type: integer
            sideQuest:
              type: integer
    UpdateMeInput:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 80
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
    PrivateRecord:
      type: object
      properties:
        attempts:
          type: array
          items:
            type: object
            properties:
              runId:
                type: string
                format: uuid
              occupation:
                type: string
              levelNo:
                type: integer
              scenarioTitle:
                type: string
              finishedAt:
                type: string
                format: date-time
              endingType:
                type: string
                enum:
                  - GOOD
                  - PARTIAL
                  - BAD
                  - SECRET
        competencies:
          type: array
          items:
            type: object
            properties:
              competency:
                type: string
              kind:
                type: string
                enum:
                  - EXPERTISE
                  - SOFT_SKILL
              points:
                type: integer
        awards:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              awardedAt:
                type: string
                format: date-time
    QuizQuestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        scale:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
    QuizResult:
      type: object
      properties:
        scores:
          type: object
          additionalProperties:
            type: integer
          examples:
            - R: 12
              I: 18
              A: 9
              S: 15
              E: 11
              C: 7
        topType:
          $ref: '#/components/schemas/RiasecType'
        socialIndex:
          type: integer
        portrait:
          type: object
          properties:
            text:
              type: string
            selfReported:
              type: boolean
              const: true
        suggestions:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              occupationId:
                type: string
                format: uuid
              name:
                type: string
              riasecCode:
                type: string
    DomainOnMap:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        occupations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              summary:
                type: string
              myProgress:
                type: integer
                description: Highest level completed
    OccupationProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        summary:
          type: string
        downsides:
          type: array
          items:
            type: string
        careerPath:
          type: array
          items:
            type: object
            properties:
              levelNo:
                type: integer
              title:
                type: string
              description:
                type: string
              futureRole:
                type: string
              salary:
                type: object
                properties:
                  min:
                    type: number
                  max:
                    type: number
                  currency:
                    type: string
              access:
                type: string
                enum:
                  - OPEN
                  - LOCKED
                  - ENROLLED
                  - COMPLETED
        ratings:
          $ref: '#/components/schemas/RatingSummary'
        aiDisclosure:
          type: string
          description: Shown where content or grading is AI-produced (NFR-07)
    LevelView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        levelNo:
          type: integer
        title:
          type: string
        description:
          type: string
        access:
          type: string
          enum:
            - OPEN
            - LOCKED
            - ENROLLED
            - COMPLETED
        accessReason:
          type: string
          enum:
            - ENTRY
            - UNLOCKED
            - ADJACENT
            - NONE
        enrolmentId:
          type:
            - string
            - 'null'
          format: uuid
    IslandMap:
      type: object
      properties:
        enrolmentId:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/LevelView'
        credit:
          type: integer
        creditThreshold:
          type: integer
        mainQuests:
          type: array
          items:
            type: object
            properties:
              taskId:
                type: string
                format: uuid
              title:
                type: string
              available:
                type: boolean
              bestEnding:
                type:
                  - string
                  - 'null'
              inProgressRunId:
                type:
                  - string
                  - 'null'
                format: uuid
        sideQuests:
          type: array
          items:
            type: object
            properties:
              sideQuestId:
                type: string
                format: uuid
              prompt:
                type: string
              taskType:
                $ref: '#/components/schemas/TaskType'
              points:
                type: integer
              done:
                type: boolean
        suggestedTasks:
          type: array
          description: Tasks for missing competencies when below the threshold
          items:
            type: string
            format: uuid
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - IN_PROGRESS
            - FINISHED
            - ABANDONED
        isPlaytest:
          type: boolean
        releaseVersion:
          type: string
          description: Version key of the release file on the CDN
        intro:
          type: string
        context:
          type: object
          description: Role, team and goal; opened on request (FR-09)
          properties:
            role:
              type: string
            team:
              type: string
            situation:
              type: string
            stakes:
              type: string
        currentActivityKey:
          type:
            - string
            - 'null'
        startedAt:
          type: string
          format: date-time
    ActivityView:
      type: object
      properties:
        activityKey:
          type: string
        taskType:
          $ref: '#/components/schemas/TaskType'
        setup:
          type: string
        npc:
          type: object
          properties:
            npcKey:
              type: string
            name:
              type: string
            avatarUrl:
              type: string
              format: uri
            line:
              type: string
        inputPrompt:
          type: string
        items:
          type: array
          description: Options for CHOICE, steps for ORDERING, items for PRIORITIZING (without scores)
          items:
            type: object
            properties:
              key:
                type: string
              text:
                type: string
              note:
                type: string
        pickCount:
          type: integer
        hintAvailable:
          type: boolean
        randomEvent:
          type:
            - object
            - 'null'
          properties:
            randomEventId:
              type: string
              format: uuid
            text:
              type: string
            prompt:
              type: string
    AnswerInput:
      type: object
      required:
        - answerId
        - activityKey
      properties:
        answerId:
          type: string
          format: uuid
          description: Created by the client; makes retries safe
        activityKey:
          type: string
        followupNo:
          type: integer
          minimum: 0
          default: 0
        randomEventId:
          type: string
          format: uuid
          description: Set when answering a random event
        text:
          type: string
          maxLength: 4000
          description: FREE_TEXT answer
        selection:
          description: CHOICE → one key; ORDERING → keys in order; PRIORITIZING → picked keys
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    AnswerResult:
      type: object
      description: Result of a closed answer, scored from the expert option scores; closed answers are never penalised
      properties:
        answerId:
          type: string
          format: uuid
        score:
          $ref: '#/components/schemas/Score'
        hintUsed:
          type: boolean
          description: The hint was viewed; recorded only, it does not lower the score (FR-13)
        npcResponse:
          type: string
        closingLine:
          type: string
        nextActivityKey:
          type:
            - string
            - 'null'
    ScenarioSummary:
      type: object
      description: Result, feedback and guidance kept separate (FR-14)
      properties:
        runId:
          type: string
          format: uuid
        scenarioTitle:
          type: string
        ending:
          type: object
          properties:
            type:
              type: string
              enum:
                - GOOD
                - PARTIAL
                - BAD
                - SECRET
            text:
              type: string
            reveals:
              type:
                - string
                - 'null'
        result:
          type: string
        feedback:
          type: string
        guidance:
          type: string
        pointsEarned:
          type: object
          properties:
            expertise:
              type: integer
            softSkill:
              type: integer
        hintsUsed:
          type: integer
        levelUnlocked:
          type: boolean
        suggestedTasks:
          type: array
          items:
            type: string
            format: uuid
        finishedAt:
          type: string
          format: date-time
    StreamEvent:
      type: object
      description: Data part of one SSE message
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - answer.graded
            - followup.asked
            - activity.closed
            - provider.delay
            - summary.ready
            - generation.ready
            - revision.ready
            - suggestions.ready
            - asset.ready
            - draft.ready
            - review.outcome
            - findings.reported
            - import.finished
            - job.finished
        jobId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        scenarioId:
          type: string
          format: uuid
        payload:
          type: object
          examples:
            - followupNo: 1
              question: Bạn sẽ báo cáo cho ai trước?
    RatingInput:
      type: object
      required:
        - scores
      properties:
        scores:
          type: object
          description: Five attributes (project-defined), each 1–5
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 5
        comment:
          type: string
          maxLength: 2000
    RatingSummary:
      type: object
      properties:
        responseCount:
          type: integer
        withheld:
          type: boolean
          description: True below the minimum population (NFR-06)
        averages:
          type: object
          additionalProperties:
            type: number
    Domain:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        occupationCount:
          type: integer
    DomainInput:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
    StaffOccupation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
