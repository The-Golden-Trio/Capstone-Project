          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffAccountInput'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminView'
        '409':
          $ref: '#/components/responses/Conflict'
      x-screens:
        - A02 Account management
  /admin/users/{userId}:
