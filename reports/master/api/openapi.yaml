  /stream:
    get:
      tags:
        - Stream
      operationId: openEventStream
      summary: Open the event stream (Server-Sent Events)
      description:
        'One stream per open screen that waits for results. Event types:

        `answer.graded`, `followup.asked`, `activity.closed`, `provider.delay`, `summary.ready` (explorers);

        `generation.ready`, `revision.ready`, `suggestions.ready`, `asset.ready`, `draft.ready`, `review.outcome`, `findings.reported`,
        `import.finished` (staff); `job.finished` (re-run of a failed job, AI regrade of blind samples).

        The `id` field lets the browser resume with `Last-Event-ID`.

        Because the browser `EventSource` cannot send an `Authorization` header, clients open the stream with `fetch` and
        read the body as a stream.


        Opened only by the screens that wait for AI or job results (E11, E12, C03, C06, C07, D03, D05, D07, A05) and closed
        when the screen is left; other screens use `GET /staff/notifications`.'
