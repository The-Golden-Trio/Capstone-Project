# Hồ sơ NPC tarot v0.6. Hai khối tách nhau:
#   nguoi  — con người khi đi làm; AI-4 đọc ở MỌI cảnh. Không chuyện đời, không nghề ngoài đời, không quan hệ với người chơi.
#   doi_tu — câu chuyện riêng; AI-4 chỉ đọc ở nhiệm vụ phụ, theo mức thân. Menu hồ sơ hiện theo trang sổ tay.
