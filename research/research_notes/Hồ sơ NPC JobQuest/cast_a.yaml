        ghet: {bieu_cam: lo_lang, text: Ờ… cảm ơn nha. Để tui… đọc thử coi.}
        trung_lap: {bieu_cam: vui, text: Cảm ơn nha!}
        sinh_nhat: {bieu_cam: ngac_nhien, text: 'Ủa, nhớ luôn hả? Tui còn quên nữa đó!'}
