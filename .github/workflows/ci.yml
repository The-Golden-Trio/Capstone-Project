name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # `prisma generate` (chạy trước build, test, typecheck của API) đọc
    # apps/api/prisma.config.ts, mà file đó đòi DIRECT_URL có mặt. Không kết
    # nối DB nào: giá trị chỉ cần tồn tại.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx format:check --base=origin/main
      - run: pnpm exec nx run-many -t lint test build typecheck
