      x-roles:
        - SYSTEM_ADMIN
      x-fr:
        - FR-40
      responses:
        '200':
          description: Occupations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccupationStaffingRow'
      x-screens:
        - A03 Occupation staffing
  /admin/occupations/{occupationId}/staff:
    parameters:
      - $ref: '#/components/parameters/OccupationId'
    get:
      tags:
        - Admin
      operationId: getOccupationStaff
      summary: Get the content admin and domain experts of an occupation
      x-roles:
        - SYSTEM_ADMIN
      x-fr:
        - FR-40
      responses:
        '200':
          description: Staffing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupationStaff'
      x-screens:
        - A03 Occupation staffing
    put:
      tags:
        - Admin
      operationId: setOccupationStaff
      summary: Assign or reassign the content admin and domain experts
      description:
        Exactly one content admin and at least one domain expert. Changing the content admin moves its pending
        work to the new one.
      x-roles:
        - SYSTEM_ADMIN
      x-fr:
        - FR-40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccupationStaff'
      responses:
        '200':
          description: Staffing saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupationStaff'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-screens:
        - A03 Occupation staffing
  /admin/metrics:
    get:
      tags:
        - Admin
      operationId: getMetrics
      summary: Get usage, cost per session and error metrics
      x-roles:
        - SYSTEM_ADMIN
      x-fr:
        - FR-43
        - NFR-11
      parameters:
        - name: from
