# Overlay for gen_domain.py. The ERD (plantuml/erd/ERD_JobQuest_Chen.puml) stays the source of truth and is
# never edited; this file only holds what an ERD cannot say and that a class diagram needs:
# which diagram a section goes to, how to read the (min,max) labels, aggregation, {xor} groups,
# attribute types, enum values, OCL constraints and domain methods (each with its source).

diagrams:
  CD-01: {title: "Identity and access", file: CD-01_Identity, sections: [A]}
  CD-02: {title: "Catalogue, reference data, soft skills and keywords", file: CD-02_CatalogueAndReference, sections: [B, C]}
  CD-03: {title: "Level pack and scenario content", file: CD-03_ScenarioContent, sections: [D, E]}
  CD-04: {title: "AI drafting, review, presentation, play-test and release", file: CD-04_AuthoringReviewRelease, sections: [F]}
  CD-05: {title: "Tarot NPCs, side quests, economy, health and calendar", file: CD-05_NpcAndLife, sections: [G, K]}
  CD-06: {title: "Explorer profile and progression", file: CD-06_ExplorerProfileAndProgress, sections: [H, I]}
  CD-07: {title: "Runs and grading", file: CD-07_RunsAndGrading, sections: [J]}
  CD-08: {title: "Grading quality, feedback and AI operations", file: CD-08_QualityFeedbackAndAiOps, sections: [L]}

# The ERD mixes two conventions for the label next to an entity. Default ("count"): the label is how many of THAT entity
# sit at its end of the association. Relationships listed here use "partners": the label next to E is how many partners
# each E has (so it is the multiplicity at the OTHER end). Reading follows the domain meaning of each case.
partners_reading:
  MAPS_TO_ONET: "D-123: an occupation maps to 1-2 O*NET codes"
  MAPS_TO_ESCO: "D-123: an occupation maps to 1-2 ESCO occupations"
  REQUIRES_KEYWORD: "D-118/D-120: 5-10 output keywords per occupation"
  TRAINS: "a level trains 0-5 keywords"
  BUDGETS: "D-114: every level budgets all 7 soft skill groups"
  FOCUSES_ON: "a scenario focuses on 1-2 keywords"
  ANSWERS_CARD: "Get to know me has 18 cards"
  LIKES: "an explorer likes at most 5 hobbies"
  PROGRESSES: "an explorer has points in all 7 groups"
  BOOSTS: "D-113: a zodiac sign boosts 2 groups"
  SUGGESTS: "a suggestion shows at most 9 occupations"
  HAS_HABIT: "S6: at most 3 habits per explorer"
  SCORES_ATTR: "FR-19: 5 rating attributes per rating"

# Whole-part without existence dependence (the part is a strong entity with its own id): aggregation.
# Value = the entity that is the whole. Identifying relationships of the ERD become composition instead.
aggregation:
  IN_REGION: INTEREST_REGION
  IN_GROUP: OCCUPATION_GROUP
  PARENT_OF: ESCO_SKILL_GROUP
  ITEM_OF: SOFT_SKILL_GROUP
  OPENS: USER_ACCOUNT
  REQUESTS_RESET: USER_ACCOUNT
  TAKES: EXPLORER
  SETS_GOAL: EXPLORER
  ENROLS: EXPLORER
  TRANSACTS: EXPLORER
  OWNS: EXPLORER
  CALLS: AI_JOB
  DECIDES: REVIEW_ASSIGNMENT

# Roles for relationships that join an entity to itself or repeat a pair. First role belongs to the first end
# (file order of the ERD link), the second to the other end.
roles:
  REQUIRES_PRIOR: [dependent, prerequisite]
  SIMILAR_TO: [source, target]
  PARENT_OF: [parent, child]
  TRANSFERS_TO: [from, to]
  RELATES_TO: [from, to]
  REASSIGNS: [replaced, replacement]
  FALLS_BACK_TO: [outfit, fallback]
  REVIEWER: [reviewed, reviewer]
  ASSIGNER: [assigned, assigner]
  NODE_SETS_FLAG: [setter, sets]
  NODE_READS_FLAG: [reader, reads]
  SPEAKS: [speaks, speaker]
  RECHECKS: [rechecks, rechecked]
  REMEMBERS: [memory, rememberer]
  PRESENT: [memory, present]

# Alternatives drawn as separate 0..1 associations that exactly one of which is set ({xor}).
xor_groups:
  LOGS: {rels: [LOGS_SCENARIO, LOGS_PACK, LOGS_OCCUPATION, LOGS_CHAPTER], text: "a log row is about exactly one of scenario, level pack, occupation or NPC chapter"}
  REVIEWS: {rels: [REVIEWS_SCENARIO, REVIEWS_PACK], text: "an assignment reviews a scenario or a level pack"}
  INTERVIEW_FOR: {rels: [INTERVIEW_FOR_SCENARIO, INTERVIEW_FOR_PACK], text: "an interview is for a scenario or a level pack"}
  RUN_OF: {rels: [OF_RELEASE, OF_BUILD], text: "a run plays a release, or a build when isPlaytest"}
  SEGMENT_AT: {rels: [SEGMENT_AT_NODE, SEGMENT_AT_PROBE], text: "a segment sits at a node or at a review probe (by kind)"}
  CHECKS_ON: {rels: [CHECKS_ON_ARTEFACT, CHECKS_ON_NODE], text: "a check is on an artefact or on a node"}
  SIDE_OF: {rels: [OF_CHAPTER, OF_ACTIVITY], text: "a side quest run is of an NPC chapter or of a side activity"}
  TXN: {rels: [TXN_RUN, TXN_ITEM, TXN_MILESTONE, TXN_OCCASION], text: "the reference depends on kind; may be none"}
  GAIN: {rels: [GAIN_RUN, GAIN_SIDE, GAIN_ITEM], text: "the source depends on source (run, side quest, item)"}

# OCL-style constraints that the ERD only states in comments or cannot state. Shown as notes.
constraints:
  ASSIGNED_TO: "{ at most one CONTENT_ADMIN per Occupation }  FR-40"
  KNOWS: "{ the 6 cards open at the start (N1) exist for every Explorer }"
  PERFORMS_TASK: "{ task.level = scenario.level }"
  FROM_PRESENTATION: "{ presentation.scenario = build.scenario }"
  ANSWERS_CRITERION: "{ criterion belongs to the review's criteria version }"
  PLACES_DECOR: "{ only items the explorer OWNS can be placed }"
  ANSWERS_CARD: "{ 18 answers once the attempt is complete }"
  RELEASED_FROM: "{ a release is built from exactly one build }"
  EARNED_KEYWORD: "{ unique (explorer, keyword) }"
  DRESSES: "{ unique (department, companyType); empty companyType = default rule }"

# Attribute types. The ERD has none; these are inferred from names, rules and research, so read them as proposals.
# Lookup order: types_by_entity["ENTITY.attr"] -> types_by_name[attr] -> pattern rules -> String.
type_patterns:
  - {re: "^id$", type: uuid}
  - {re: "_id$", type: uuid}
  - {re: "_at$", type: DateTime}
  - {re: "^(is|has)_", type: Boolean}
  - {re: "_date$", type: Date}
types_by_name:
  at: DateTime
  deadline: DateTime
  effective_from: DateTime
