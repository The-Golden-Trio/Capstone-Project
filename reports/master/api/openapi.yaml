          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
      x-screens:
        - A01 System Admin portal
        - A05 Operations monitor
  /admin/ai-jobs:
    get:
      tags:
        - Admin
      operationId: listAiJobs
      summary: List AI jobs, e.g. failed ones with their cause
      x-roles:
        - SYSTEM_ADMIN
      x-fr:
        - FR-43
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - QUEUED
              - RUNNING
              - SUCCEEDED
              - FAILED
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AiJob'
      x-screens:
        - A05 Operations monitor
  /admin/ai-jobs/{jobId}/rerun:
    parameters:
      - name: jobId
        in: path
