      x-roles:
        - SYSTEM_ADMIN
      x-fr:
        - FR-41
        - DR-16
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActivityLogEntry'
      x-screens:
        - A02 Account management
  /admin/occupations:
    get:
      tags:
        - Admin
      operationId: listOccupationsForStaffing
