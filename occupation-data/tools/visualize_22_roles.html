<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Vietnam Roles Dataset Viewer</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-hover: #f9fafb;
      --border: #e5e7eb;
      --text-main: #111827;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --success: #10b981;
      --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-hover: #334155;
        --border: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #3b82f6;
        --primary-light: #1e3a8a;
      }
    }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
    
    #upload-screen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    .upload-box { background: var(--surface); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; border: 2px dashed var(--primary); }
    input[type="file"] { margin-top: 20px; }

    aside { width: 320px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
    .sidebar-header h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: var(--primary); }
    .search-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-main); outline: none; }
    .role-list { flex: 1; overflow-y: auto; padding: 10px; }
    .role-item { padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 5px; border: 1px solid transparent; }
    .role-item:hover { background: var(--surface-hover); }
    .role-item.active { background: var(--primary-light); border-color: var(--primary); }
    .role-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    .role-meta { font-size: 0.8rem; color: var(--text-muted); }
    
    main { flex: 1; overflow-y: auto; padding: 30px; background: var(--bg); }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    .card { background: var(--surface); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
    .card h2 { margin: 0 0 15px 0; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .badge-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); }
    .badge.primary { background: var(--primary); color: white; border: none; }
    .badge.highlight { background: var(--primary-light); color: var(--primary); border: none; }
    
    .bar-row { display: flex; align-items: center; margin-bottom: 10px; gap: 15px; }
    .bar-label { width: 140px; font-size: 0.85rem; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; background: var(--bg); border-radius: 6px; height: 12px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--primary); border-radius: 6px; transition: width 0.5s; }
    .bar-value { width: 100px; font-size: 0.85rem; font-weight: 600; }
    
    .event-card { background: var(--surface-hover); border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
    .event-title { font-weight: bold; margin-bottom: 5px; color: var(--primary); }
    .event-setup { font-size: 0.9rem; margin-bottom: 10px; color: var(--text-muted); }
    .choice-item { font-size: 0.85rem; padding: 8px; border-left: 3px solid var(--primary); background: var(--bg); margin-bottom: 5px; border-radius: 0 4px 4px 0; }
    .choice-outcome { color: var(--text-muted); margin-top: 4px; font-style: italic; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .info-section { margin-bottom: 15px; }
    .info-section strong { font-size: 0.9rem; display: block; margin-bottom: 5px; }
    .info-section div { color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; }
  </style>
</head>
<body>

  <div id="upload-screen">
    <div class="upload-box">
      <h2 style="margin-top: 0">Visualize 22 Roles Dataset</h2>
      <p style="color: var(--text-muted)">Vui lòng chọn file <b>dataset_22_roles_enriched_2.json</b> để tiếp tục.</p>
      <input type="file" id="fileInput" accept=".json">
    </div>
  </div>

  <aside>
    <div class="sidebar-header">
      <h1>Vietnam IT Roles Map</h1>
      <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm role, kỹ năng...">
    </div>
    <div class="role-list" id="roleList"></div>
  </aside>

  <main>
    <div class="container" id="mainContent">
      <div style="text-align: center; color: var(--text-muted); margin-top: 20vh;">
        <h2>Vui lòng chọn một role ở menu bên trái</h2>
      </div>
    </div>
  </main>

  <script>
    let dataset = null;
    const formatMoney = (val) => val ? (val / 1000000).toFixed(1).replace('.0', '') + ' tr' : 'N/A';

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          dataset = JSON.parse(e.target.result);
          document.getElementById('upload-screen').style.display = 'none';
          initApp();
        } catch (err) {
          alert('Lỗi đọc file JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
    });

    function initApp() {
      renderRoleList(dataset.roles);
      document.getElementById('searchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = dataset.roles.filter(r => 
          r.role_name.toLowerCase().includes(query) || 
          r.role_name_vn.toLowerCase().includes(query) ||
          r.role_code.toLowerCase().includes(query)
        );
        renderRoleList(filtered);
      });
    }

    function renderRoleList(roles) {
      const list = document.getElementById('roleList');
      list.innerHTML = roles.map(r => `
        <div class="role-item" onclick="selectRole('${r.role_code}')" id="role-${r.role_code}">
          <div class="role-name">${r.role_name}</div>
          <div class="role-meta">${r.role_group} • Band ${r.bands}</div>
        </div>
      `).join('');
    }

    function selectRole(code) {
      document.querySelectorAll('.role-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`role-${code}`).classList.add('active');
      const role = dataset.roles.find(r => r.role_code === code);
      renderRoleDetail(role);
    }

    function renderRoleDetail(role) {
      const content = document.getElementById('mainContent');
      
      let html = `
        <div class="card">
          <div class="badge-container">
            <span class="badge primary">${role.role_code}</span>
            <span class="badge">${role.role_group}</span>
            <span class="badge">Archetype ${role.archetype}</span>
            <span class="badge">Bands: ${role.bands}</span>
          </div>
          <h1 style="margin: 0 0 5px 0;">${role.role_name}</h1>
          <p style="margin: 0; color: var(--text-muted);">${role.role_name_vn}</p>
          <p style="margin: 15px 0 0 0; font-style: italic; padding-left: 10px; border-left: 3px solid var(--primary);">${role.roleplay_experience}</p>
        </div>
      `;

      html += `<div class="grid-2">`;

      const salaries = role.compensation?.itviec_2025_2026?.by_experience || [];
      const maxSal = Math.max(...salaries.map(s => s.median || 0), 10000000);
      
      html += `
        <div class="card">
          <h2>Mức lương (Thị trường VN)</h2>
          ${salaries.length === 0 ? '<p class="bar-label" style="text-align: left">Không có dữ liệu</p>' : ''}
          ${salaries.map(s => `
            <div class="bar-row">
              <div class="bar-label">${s.yoe}</div>
              <div class="bar-track">
                <div class="bar-fill" style="width: ${s.median ? (s.median / maxSal * 100) : 0}%"></div>
              </div>
              <div class="bar-value">
                ${s.median ? formatMoney(s.median) : '<span style="font-size:0.75rem; font-weight:normal; color: var(--text-muted);">Thiếu data</span>'}
              </div>
            </div>
          `).join('')}
        </div>
      `;

      const langs = role.skills_status?.hard_skills_languages || [];
      const fws = role.skills_status?.hard_skills_frameworks || [];
      
      html += `
        <div class="card">
          <h2>Kỹ năng cốt lõi</h2>
          <div class="info-section">
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">Ngôn ngữ:</div>
            <div class="badge-container">
              ${langs.length ? langs.map(l => `<span class="badge">${l.skill}</span>`).join('') : '<span class="badge">N/A</span>'}
            </div>
          </div>
          <div class="info-section">
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">Frameworks/Tools:</div>
            <div class="badge-container">
              ${fws.length ? fws.map(f => `<span class="badge">${f.skill}</span>`).join('') : '<span class="badge">N/A</span>'}
            </div>
          </div>
        </div>
      </div>`; 

      const ctx = role.compensation?._context || {};
      const equipment = ctx.standard_equipment || "Theo tiêu chuẩn công ty";
      const perks = ctx.role_specific_benefits || [];
      const insurance = ctx.social_insurance_policy || "Đóng BHXH theo luật nhà nước";
      
      html += `
        <div class="card">
          <h2>Phúc lợi & Thiết bị làm việc</h2>
          <div class="grid-2">
            <div class="info-section">
              <strong>💻 Trang thiết bị tiêu chuẩn</strong>
              <div>${equipment}</div>
            </div>
            <div class="info-section">
              <strong>🛡️ Chế độ Bảo hiểm</strong>
              <div>${insurance}</div>
            </div>
          </div>
          <div class="info-section" style="margin-top: 10px;">
            <strong>🎁 Đặc quyền chuyên môn (Role-specific Perks)</strong>
            <div class="badge-container" style="margin-top: 8px;">
              ${perks.length ? perks.map(p => `<span class="badge highlight">${p}</span>`).join('') : '<span class="badge">Theo quy định chung</span>'}
            </div>
          </div>
        </div>
      `;

      const edges = role.graph_edges || {};
      html += `
        <div class="card">
          <h2>Mạng lưới nghề nghiệp</h2>
          <div class="grid-2">
            <div class="info-section">
              <strong>Có thể thăng tiến lên:</strong>
              <div class="badge-container" style="margin-top: 8px">
                ${edges.progresses_to && edges.progresses_to.length ? edges.progresses_to.map(e => `<span class="badge primary">${e}</span>`).join('') : '<span class="badge">N/A</span>'}
              </div>
            </div>
            <div class="info-section">
              <strong>Nghề tương tự:</strong>
              <div class="badge-container" style="margin-top: 8px">
                ${edges.similar_ranked && edges.similar_ranked.length ? edges.similar_ranked.map(e => `<span class="badge">${e.role_name} (${(e.weight*100).toFixed(0)}%)</span>`).join('') : '<span class="badge">N/A</span>'}
              </div>
            </div>
          </div>
        </div>
      `;

      const events = role.roleplay_events?.role_specific || [];
      html += `
        <div class="card">
          <h2>Tình huống thực tế (Roleplay Events)</h2>
          ${events.map(e => `
            <div class="event-card">
              <div class="event-title">${e.title}</div>
              <div class="event-setup">${e.setup}</div>
              <div class="badge-container">
                ${e.measures.map(m => `<span class="badge" style="border-color: var(--primary); color: var(--primary)">${m}</span>`).join('')}
              </div>
              <div style="margin-top: 10px;">
                ${e.choices.map(c => `
                  <div class="choice-item">
                    <div><b>Quyết định:</b> ${c.text}</div>
                    <div class="choice-outcome"><b>Kết quả:</b> ${c.outcome}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
          ${events.length === 0 ? '<p>Không có dữ liệu tình huống cho role này.</p>' : ''}
        </div>
      `;

      content.innerHTML = html;
      content.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
