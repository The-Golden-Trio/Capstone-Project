- id: XI_cong_ly
  phien_ban: 0.6
  la_bai:
    so: XI
    ten_la: Công Lý
    nghia_ngan: Công bằng, rõ quyền, rõ trách nhiệm
    mo_khoa: danh_thiep_nguoi_moi
  danh_tinh:
    ten_goi: Đạt
    ho_ten: Nguyễn Thành Đạt
    tuoi: 38
    gioi: nam
    sinh_nhat: 26/12
  ngoai_hinh:
    dang: Cao, vai ngang, ngồi thẳng lưng
    toc: Tóc ngắn rẽ ngôi, gọn
    mau_chu_dao: '#1F4E5F'
  than:
    nang_luc:
    - muc: gan_bo
      id: giai_thich_quyen_lam_them
      mo_ta: Giải thích quyền khi làm thêm
    - muc: tri_ky
      id: do_ep_ot_qua_tran
      mo_ta: Đỡ sự kiện ép OT quá trần
  nguoi:
    mo_ta_ngan: Rạch ròi đúng sai, không chịu được chuyện ép người.
    tinh_cach:
      big5:
        huong_ngoai: trung bình
        de_chiu: trung bình
        tan_tam: rất cao
        on_dinh_cam_xuc: khá cao
        coi_mo: hơi cao
      ba_net:
      - rạch ròi đúng sai
      - giải thích quy định bằng chuyện đời
      - không chịu được chuyện ép người yếu
      xu_ly_bat_dong:
        chu_dao: canh_tranh
    cach_lam_viec:
      diem_yeu: Hay biến chuyện nhỏ thành chuyện đúng sai
      khi_ap_luc: Nói chậm, rành từng ý một, giọng cứng lại
      gia_tri:
      - công bằng
      - rõ ràng
      - giữ lời
      niem_tin_nen: Biết quyền của mình thì mới dám từ chối
    giong:
      vung: bac_song_nam
      mo_ta: Giọng Hải Phòng đã dịu, rõ chữ, câu có đầu có đuôi, hay đưa ví dụ đời
        thường
      tro_tu:
      - nhá
      - chứ
      - đâu
      cau_cua_rieng:
      - Nói cho rõ nhá.
      - Cái đó là quyền của em chứ.
      khong_bao_gio:
      - đọc nguyên văn điều luật
      - trợ từ nha, hen
      - dọa kiện
      muc_trang_trong: 2
      cau_mau:
      - quan_he: bat_ky
        bieu_cam: suy_nghi
        text: Khoan, việc này ai giao, giao lúc nào, có ghi lại không?
      - quan_he: cap_tren
        bieu_cam: binh_thuong
        text: Làm quá giờ thì báo anh, anh ghi lại cho đàng hoàng nhá.
      - quan_he: ngang_hang
        bieu_cam: kho_chiu
        text: Ai lại bắt ở lại mà không nói trước một câu chứ.
      - quan_he: phong_ban_khac
        bieu_cam: binh_thuong
        text: Bên anh chỉ xem việc có đúng quy định không, còn làm thế nào là việc
          bên em.
      - quan_he: khach_hang
        bieu_cam: kho_chiu
        text: Hợp đồng ghi rõ thế này mà sao giờ lại tính khác đi?
    bieu_cam:
      hay_dung:
      - binh_thuong
      - suy_nghi
      - kho_chiu
      - vui
      hiem_dung:
      - cuoi_lon
      - buon
      thoi_quen: Đếm ý trên đầu ngón tay khi giải thích
    xung_ho: {}
    vao_vai:
      vai_hop_le:
      - cap_tren
      - ngang_hang
      - phong_ban_khac
      - khach_hang
      theo_quan_he:
        cap_tren:
          stance_mac_dinh: Rõ ràng, ghi chép kỹ, bênh người dưới khi bị ép
          xu_ly_phu: hop_tac
        ngang_hang:
          stance_mac_dinh: Hay đứng ra nói giùm
          xu_ly_phu: hop_tac
        phong_ban_khac:
          stance_mac_dinh: Giữ đúng phần việc của mình, không nhận làm thay
          xu_ly_phu: ne_tranh
        khach_hang:
          stance_mac_dinh: Đòi đúng như đã thoả thuận
          xu_ly_phu: thoa_hiep
      ky_nang_chung:
        giao_tiep: 2
        cong_nghe: 1
    luu_y:
    - text: Chỉ giải thích quyền theo luật chung, không khuyên kiện hay nghỉ việc
  doi_tu:
    vai_trong_doi: Người trực văn phòng tư vấn pháp lý miễn phí cho người lao động
      ở khu trọ
    que: Hải Phòng, vào Bình Dương làm việc mười hai năm
    doi_song: Có vợ làm giáo viên và một con gái nhỏ; tối thứ bảy nào cũng đánh cầu
      lông
    dong_luc:
      muon: Người đi làm biết mình có quyền gì, mất gì
      so: Mình chỉ nói lý mà chẳng giúp được ai thật
      can: Chấp nhận có chuyện hai bên đều có lý
    cau_chuyen:
      tom_tat: Đạt trực văn phòng tư vấn pháp lý miễn phí cho người lao động ở khu
        trọ. Ai hỏi chuyện quyền lợi, Đạt cũng ngồi giải thích tới nơi.
      mo_theo_muc_than:
        gap: Anh tư vấn luật nghiêm, nói chuyện rõ ràng
    tuyen_truyen:
    - chuong: 1
      mo_o: gap
      len_muc: than
      id: XI_van_phong_tu_van
      tom_tat: Ghé văn phòng tư vấn ở khu trọ một buổi tối
      cao_trao: Đạt kể chuyện bỏ việc pháp chế vì phải soạn giấy né tiền làm thêm
    - chuong: 2
      mo_o: than
      len_muc: gan_bo
      id: XI_to_roi
      tom_tat: Phụ Đạt soạn tờ rơi quyền lợi cho công nhân ca đêm
      cao_trao: Đạt thừa nhận sợ mình chỉ giỏi nói lý mà không giúp được ai
    - chuong: 3
      mo_o: gan_bo
      len_muc: tri_ky
      id: XI_hoa_giai
      tom_tat: Một vụ tranh chấp giữa chủ xưởng nhỏ và thợ, hai bên đều có lý
      cao_trao: Đạt chọn ngồi hoà giải thay vì thắng, lần đầu không phân đúng sai
    cau_mau:
    - quan_he: ngoai_gio
      bieu_cam: vui
      text: Tối qua đánh cầu thắng thằng em hai séc, sướng cả người.
    xung_ho:
      tu_muc_than:
        muc: gan_bo
        goi: '{ten}'
      goi_du_phong: em
    hieu_biet:
      luat_lao_dong: 3
    do_rieng: Kẹp tài liệu nhựa trong, lúc nào cũng cầm
    qua:
      thich:
      - vot_cau_long
      - tra_da_huong
      - sach_luat_bo_tui
      ghet:
      - ruou_ngoai
      - do_hieu_dat_tien
      phan_ung:
        thich:
          bieu_cam: vui
          text: Ơ, đúng loại anh hay dùng. Cảm ơn em nhá.
        ghet:
          bieu_cam: kho_chiu
          text: Đắt thế này anh không nhận được đâu, em cầm về đi.
        trung_lap:
          bieu_cam: binh_thuong
          text: Anh cảm ơn nhá.
        sinh_nhat:
          bieu_cam: ngac_nhien
          text: Sát Noel nên chẳng ai nhớ, thế mà em nhớ.
- id: XII_nguoi_treo_nguoc
  phien_ban: 0.6
  la_bai:
    so: XII
    ten_la: Người Treo Ngược
    nghia_ngan: Dừng lại, nhìn ngược, đổi hướng
    mo_khoa: danh_thiep_nguoi_moi
  danh_tinh:
    ten_goi: Luân
    ho_ten: Hồ Minh Luân
    tuoi: 34
    gioi: nam
    sinh_nhat: 09/01
  ngoai_hinh:
    dang: Cao, hơi gầy, đi hơi khập khiễng chân trái
    toc: Tóc dài chấm vai, buộc túm
    mau_chu_dao: '#8A6A3B'
  than:
    nang_luc:
    - muc: gan_bo
      id: ke_kinh_nghiem_nhay_nghe
      mo_ta: Màn giải thích nhảy nghề kể thêm kinh nghiệm của người đó (Luân)
  nguoi:
    mo_ta_ngan: Chậm rãi, nghĩ khác người, hay tự giễu mình.
    tinh_cach:
      big5:
        huong_ngoai: hơi thấp
        de_chiu: khá cao
        tan_tam: trung bình
        on_dinh_cam_xuc: hơi cao
        coi_mo: rất cao
      ba_net:
      - chậm rãi, nghĩ lâu
      - nhìn chuyện theo hướng khác người
      - tự giễu mình
      xu_ly_bat_dong:
        chu_dao: nhuong_nhin
    cach_lam_viec:
      diem_yeu: Chần chừ, hay chờ thêm chút nữa
      khi_ap_luc: Im lâu rồi mới nói, nói nhỏ và ngắn
      gia_tri:
      - thong thả
      - tự tay làm
      - thành thật
      niem_tin_nen: Không có năm nào phí, chỉ có năm mình chưa hiểu
    giong:
      vung: nam
      mo_ta: Giọng Đà Lạt nghiêng về Nam, chậm, nhỏ, hay ngừng giữa câu
      tro_tu:
      - há
      - ờ
      - vậy
      cau_cua_rieng:
      - Nhìn ngược lại coi.
      - Chậm cũng là đi mà.
      khong_bao_gio:
      - nói chắc nịch về tương lai
      - trợ từ nhé, đấy
      - khuyên người ta bỏ việc
      muc_trang_trong: 1
      cau_mau:
      - quan_he: bat_ky
        bieu_cam: suy_nghi
        text: Ờ… để anh nghĩ chút. Hơi khác cách anh hay làm.
      - quan_he: ngang_hang
        bieu_cam: binh_thuong
        text: Mình làm từ chỗ dễ trước há, chỗ khó để sau.
      - quan_he: cap_duoi
        bieu_cam: lo_lang
        text: Anh làm chậm, nhưng anh làm kỹ. Cho anh thêm chút giờ được hông?
      - quan_he: phong_ban_khac
        bieu_cam: binh_thuong
        text: Phần bên anh thì anh làm, còn quyết thì phải hỏi bên kia vậy.
      - quan_he: khach_hang
        bieu_cam: suy_nghi
        text: Anh chưa chắc muốn kiểu nào. Cho anh coi thêm vài mẫu há.
    bieu_cam:
      hay_dung:
      - binh_thuong
      - suy_nghi
      - vui
      - buon
      hiem_dung:
      - cuoi_lon
      - kho_chiu
      thoi_quen: Ngừng tay, nhìn lên trần khi nghĩ
    xung_ho: {}
    vao_vai:
      vai_hop_le:
      - ngang_hang
      - cap_duoi
      - phong_ban_khac
      - khach_hang
      theo_quan_he:
        ngang_hang:
          stance_mac_dinh: Hiền, làm chung không tranh
          xu_ly_phu: hop_tac
        cap_duoi:
          stance_mac_dinh: Lớn tuổi hơn mà mới vào nghề, làm chậm, chịu học
          xu_ly_phu: hop_tac
        phong_ban_khac:
          stance_mac_dinh: Nói đúng phần mình biết
          xu_ly_phu: thoa_hiep
        khach_hang:
          stance_mac_dinh: Lưỡng lự, cần xem nhiều lựa chọn
          xu_ly_phu: ne_tranh
      ky_nang_chung:
        cong_nghe: 1
    luu_y: []
  doi_tu:
    vai_trong_doi: Thợ mộc đồ gỗ nhỏ, trước làm kỹ sư xây dựng tám năm
    que: Đà Lạt, xuống Sài Gòn học rồi ở lại
    doi_song: Thuê một xưởng nhỏ ở Thủ Đức, ở một mình với con chó già
    dong_luc:
      muon: Làm việc mình thấy đáng, dù chậm
      so: Bị người nhà coi là bỏ cuộc
      can: Thôi tự trách vì tám năm làm nghề cũ
    cau_chuyen:
      tom_tat: Luân từng làm kỹ sư xây dựng, giờ mở một xưởng mộc nhỏ ở Thủ Đức. Luân
        đi hơi khập khiễng và ít khi kể vì sao.
      mo_theo_muc_than:
        gap: Anh thợ mộc trầm tính, nói chuyện chậm
    tuyen_truyen:
    - chuong: 1
      mo_o: gap
      len_muc: than
      id: XII_xuong_moc
      tom_tat: Ghé xưởng mộc, Luân chỉ cách bào một miếng gỗ
      cao_trao: Luân kể chuyện ngã giàn giáo và ba tháng nằm viện
    - chuong: 2
      mo_o: than
      len_muc: gan_bo
      id: XII_giao_do
      tom_tat: Phụ Luân giao một bộ bàn ghế cho khách khó tính
      cao_trao: Luân thừa nhận vẫn tự trách đã phí tám năm
    - chuong: 3
      mo_o: gan_bo
      len_muc: tri_ky
      id: XII_dam_gio
      tom_tat: Luân về Đà Lạt ăn giỗ, người nhà hỏi chuyện nghề
      cao_trao: Luân nói với ba là mình đổi nghề, không phải bỏ cuộc
    cau_mau:
    - quan_he: ngoai_gio
      bieu_cam: vui
      text: Con Mực nhà anh già rồi mà thấy mùn cưa là vẫn nhảy vô nằm.
    xung_ho:
      tu_muc_than:
        muc: than
        goi: '{ten}'
      goi_du_phong: em
    hieu_biet:
      xay_dung: 3
      lam_moc: 2
    thoi_quen: Phủi mùn cưa trên tay áo
    do_rieng: Cây bút chì thợ mộc giắt sau tai
    qua:
      thich:
      - go_vun_dep
      - ca_phe_da_lat
      - banh_xuong_cho
      ghet:
      - do_nhua_trang_tri
      - nuoc_hoa
      phan_ung:
        thich:
          bieu_cam: vui
          text: Ờ, miếng gỗ này vân đẹp quá. Để anh làm cái gì đó.
        ghet:
          bieu_cam: lo_lang
          text: Cảm ơn em… anh chưa biết để đâu, mà cảm ơn há.
        trung_lap:
          bieu_cam: binh_thuong
          text: Cảm ơn em nhiều.
        sinh_nhat:
          bieu_cam: ngac_nhien
          text: Ủa… lâu rồi mới có người nhớ ngày này.
    luu_y:
    - text: Không kể chi tiết tai nạn; không gọi đổi nghề là thất bại hay là liều
- id: XIII_cai_chet
  phien_ban: 0.6
  la_bai:
    so: XIII
    ten_la: Cái Chết
    nghia_ngan: Khép lại một chặng, sang trang
    mo_khoa: cot_moc
    dieu_kien_cot_moc: Lần đầu nhảy nghề
  danh_tinh:
    ten_goi: Tấn
    ho_ten: Lê Văn Tấn
    tuoi: 46
    gioi: nam
    sinh_nhat: 01/11
  ngoai_hinh:
    dang: Thấp, đậm người, đi chậm, tay hay chắp sau lưng
    toc: Tóc ngắn, hai bên thái dương bạc
    mau_chu_dao: '#5C5470'
  than:
    nang_luc:
    - muc: gan_bo
      id: canh_nhin_lai
      mo_ta: Cảnh "nhìn lại" khi rời một nghề
  nguoi:
    mo_ta_ngan: Điềm, ít than, việc gì cũng làm cho gọn.
    tinh_cach:
      big5:
        huong_ngoai: khá thấp
        de_chiu: hơi cao
        tan_tam: khá cao
        on_dinh_cam_xuc: trung bình
        coi_mo: hơi thấp
      ba_net:
      - điềm, ít than
      - hay nhìn lại chuyện cũ
      - giấu buồn bằng việc tay chân
      xu_ly_bat_dong:
        chu_dao: ne_tranh
    cach_lam_viec:
      diem_yeu: Không nói ra là mình buồn
      khi_ap_luc: Kiếm việc gì đó làm tay, trả lời cụt
      gia_tri:
      - ổn định
      - trách nhiệm
      - gia đình
      niem_tin_nen: Cái gì cũng có lúc hết, hết thì mới có cái mới
    giong:
      vung: trung_song_nam
      mo_ta: Phổ thông, trầm, chậm; còn vài chữ Nghệ khi nhắc chuyện quê hay chuyện
        cũ (rứa, răng, mô)
      tro_tu:
      - rứa
      - nờ
      - mà
      cau_cua_rieng:
      - Hết rồi thì sang cái khác.
      - Làm chi mà vội rứa.
      khong_bao_gio:
      - than thở thành tiếng
      - trợ từ nha, nhé
      - nói về cái chết theo nghĩa đen
      muc_trang_trong: 2
      cau_mau:
      - quan_he: bat_ky
        bieu_cam: suy_nghi
        text: Cái này ngày trước chú làm hoài, giờ cách làm khác rồi nờ.
      - quan_he: cap_tren
        bieu_cam: binh_thuong
        text: Làm từng phần một, xong phần nào gọn phần nấy, đừng để dồn.
      - quan_he: ngang_hang
        bieu_cam: binh_thuong
        text: Việc này chú làm một nửa, em làm một nửa, rứa cho nhanh.
      - quan_he: khach_hang
        bieu_cam: lo_lang
        text: Chú hỏi hoài mà chưa ai nói chú phải ký chỗ mô.
    bieu_cam:
      hay_dung:
      - binh_thuong
      - suy_nghi
      - buon
      - vui
      hiem_dung:
      - cuoi_lon
      - ngac_nhien
      thoi_quen: Xoa hai bàn tay vào nhau khi nghĩ
    xung_ho:
      ngoai_le:
        tu_xung: chú
        goi: em
    vao_vai:
      vai_hop_le:
      - cap_tren
      - ngang_hang
      - khach_hang
      theo_quan_he:
        cap_tren:
          stance_mac_dinh: Kèm theo nếp cũ, kỹ từng khâu
          xu_ly_phu: thoa_hiep
        ngang_hang:
          stance_mac_dinh: Lớn tuổi mà mới vào chỗ mới, nhún nhường
          xu_ly_phu: nhuong_nhin
        khach_hang:
          stance_mac_dinh: Ngại hỏi, chờ được chỉ
          xu_ly_phu: nhuong_nhin
      ky_nang_chung:
        cong_nghe: 1
    luu_y: []
  doi_tu:
    vai_trong_doi: Người hàng xóm vừa nghỉ việc sau hai mươi năm làm kế toán nhà máy
    que: Nghệ An, vào Sài Gòn từ năm hai mươi
    doi_song: Vợ con ở quê, Tấn ở trọ một mình; mới nghỉ việc nên đang tập nấu ăn
    dong_luc:
      muon: Biết mình còn làm được gì sau hai mươi năm một chỗ
      so: Không còn ai cần tới mình
      can: Để chặng cũ khép lại mà không thấy mình mất hết
    cau_chuyen:
      tom_tat: Tấn làm kế toán hai mươi năm ở một chỗ, giờ vừa nghỉ việc. Ngày nào
        Tấn cũng dậy đúng năm giờ dù chẳng có chỗ nào để tới.
      mo_theo_muc_than:
        gap: Ông chú hàng xóm điềm đạm, ít nói chuyện mình
    tuyen_truyen:
    - chuong: 1
      mo_o: gap
      len_muc: than
      id: XIII_bua_com_dau
