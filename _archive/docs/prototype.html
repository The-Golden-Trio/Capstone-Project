<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vào Nghề</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ═══ Celestial Night — bảng màu cam kết một thế giới tối,
   không có biến thể sáng. Mọi màu sơn tường minh. ═══ */
:root{
  --bg:#0A1026;          /* Deep Space      */
  --rail:#080D1F;        /* sidebar, tối hơn nội dung */
  --surf:#142B52;        /* Midnight Blue   */
  --panel:#101F3D;
  --inset:#0D1F3F;
  --chip:#1F3E68;
  --line:#254A7A;        /* Constellation   */
  --line-2:#1C3862;
  --blue:#5D7EA8;        /* Moonlight       */
  --ink:#F8F6EE;         /* Ivory White     */
  --ink-2:#C7D2E0;
  --muted:#8FA6C4;
  --gold:#D4B06A;        /* Starlight Gold  */
  --gold-2:#F0D79A;      /* Soft Gold       */
  --gold-soft:rgba(212,176,106,.13);
  --good:#74C69D;
  --good-soft:rgba(116,198,157,.12);
  --signal:#E07A6B;
  --signal-soft:rgba(224,122,107,.14);
  --lift:0 1px 2px rgba(0,0,0,.5), 0 18px 44px -24px rgba(0,0,0,.95);
  --rail-w:248px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:"Montserrat",system-ui,sans-serif; font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible,input:focus-visible{
  outline:2px solid var(--gold); outline-offset:2px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif; margin:0}

/* ══ KHUNG ỨNG DỤNG ══════════════════════════════ */
.app{display:grid; grid-template-columns:var(--rail-w) 1fr; min-height:100vh}
/* .scrim phai nam ngoai luong luoi o MOI be ngang — neu chi dat position trong
   media query thi tren desktop no thanh mot o luoi that va day .rail sang cot 2 */
.scrim{display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6)}

/* ── sidebar ── */
.rail{
  background:var(--rail); border-right:1px solid var(--line-2);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto
}
.rail-top{display:flex; align-items:center; gap:11px; padding:20px 18px 18px}
.rail-top .mark{width:34px; height:34px; flex:0 0 34px; filter:drop-shadow(0 2px 8px rgba(212,176,106,.3))}
.rail-top .bn{font-family:"Playfair Display",Georgia,serif; font-size:19px; font-weight:700; line-height:1}
.rail-top .bn span{color:var(--gold)}
.nav{flex:1; padding:4px 10px}
.nav-s{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); padding:16px 10px 7px; opacity:.75}
.nv{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 11px;
  border:none; background:none; color:var(--ink-2); font-size:13.5px; border-radius:7px; margin-bottom:2px}
.nv:hover{background:var(--panel); color:var(--ink)}
.nv[aria-current="page"]{background:var(--gold-soft); color:var(--gold-2); font-weight:600}
.nv .ic{flex:0 0 17px; height:17px; opacity:.85}
.nv .tx{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nv .cnt{font-family:"JetBrains Mono",monospace; font-size:10px; padding:2px 6px; border-radius:20px;
  background:var(--chip); color:var(--ink-2)}
.nv[aria-current="page"] .cnt{background:var(--gold); color:var(--rail)}
.nv:disabled{opacity:.35; cursor:not-allowed}
.rail-bt{border-top:1px solid var(--line-2); padding:12px 14px}
.me{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.me .av{flex:0 0 32px; height:32px; border-radius:50%; background:var(--gold); color:var(--rail);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px}
.me .nm{font-size:13px; font-weight:600; line-height:1.25}
.me .sb{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--muted)}
.tog{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted);
  font-family:"JetBrains Mono",monospace; cursor:pointer}
.tog input{margin:0; accent-color:var(--gold)}

/* ── topbar ── */
.main{display:flex; flex-direction:column; min-width:0}
.topbar{
  position:sticky; top:0; z-index:30; background:rgba(10,16,38,.92);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line-2);
  display:flex; align-items:center; gap:14px; padding:12px 26px; min-height:57px
}
.burger{display:none; width:34px; height:34px; border:1px solid var(--line); border-radius:7px;
  background:var(--inset); color:var(--ink-2); font-size:15px}
.crumb{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted);
  min-width:0; overflow:hidden; white-space:nowrap}
.crumb b{color:var(--ink); font-weight:600}
.crumb .sep{opacity:.5}
.crumb a{color:var(--muted); text-decoration:none}
.crumb a:hover{color:var(--gold-2); text-decoration:underline}
.top-sp{flex:1}
.kpi{display:flex; align-items:center; gap:6px; font-family:"JetBrains Mono",monospace;
  font-size:11px; color:var(--muted); background:var(--inset); border:1px solid var(--line-2);
  padding:5px 10px; border-radius:20px; white-space:nowrap}
.kpi b{color:var(--gold-2); font-weight:600}

/* ── vùng nội dung ── */
.page{padding:26px; max-width:1100px; width:100%}
.page-h{margin-bottom:22px}
.page-h h1{font-size:clamp(22px,3vw,29px); font-weight:600; line-height:1.2; letter-spacing:-.01em;
  text-wrap:balance; margin-bottom:6px}
.page-h p{font-size:14px; color:var(--muted); margin:0; max-width:66ch; line-height:1.6}
.reading{max-width:640px}

/* ══ THÀNH PHẦN ═══════════════════════════════════ */
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}

.card{background:var(--surf); border:1px solid var(--line); border-radius:11px}
.card-h{padding:14px 18px; border-bottom:1px solid var(--line-2); display:flex;
  align-items:center; gap:10px; flex-wrap:wrap}
.card-h h2{font-size:15px; font-weight:600; flex:1; min-width:0}
.card-b{padding:18px}

/* ô số liệu */
.stat{background:var(--panel); border:1px solid var(--line-2); border-radius:10px; padding:15px 16px}
.stat .k{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted); display:block; margin-bottom:8px}
.stat .n{font-family:"Playfair Display",Georgia,serif; font-size:27px; font-weight:700;
  line-height:1; font-variant-numeric:tabular-nums; display:block}
.stat .n.gold{color:var(--gold-2)}
.stat .s{font-size:11.5px; color:var(--muted); margin-top:6px; display:block; line-height:1.4}

/* tab */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line-2); margin-bottom:20px;
  overflow-x:auto}
.tb{border:none; background:none; color:var(--muted); font-size:13.5px; padding:10px 14px;
  border-bottom:2px solid transparent; white-space:nowrap; margin-bottom:-1px}
.tb:hover{color:var(--ink-2)}
.tb[aria-selected="true"]{color:var(--gold-2); border-bottom-color:var(--gold); font-weight:600}

/* bảng */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surf)}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:440px}
th{text-align:left; font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); padding:11px 16px;
  border-bottom:1px solid var(--line); background:var(--panel); white-space:nowrap}
td{padding:11px 16px; border-bottom:1px solid var(--line-2); color:var(--ink-2); vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.on td{background:var(--gold-soft)}
td b{color:var(--ink); font-weight:600}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums;
  font-family:"JetBrains Mono",monospace; font-size:12.5px}

/* nhãn */
.pill{font-family:"JetBrains Mono",monospace; font-size:9.5px; font-weight:500; letter-spacing:.05em;
  padding:3px 8px; border-radius:20px; background:var(--chip); color:var(--ink-2); white-space:nowrap}
.pill.a{background:var(--gold-soft); color:var(--gold-2)}
.pill.g{background:var(--good-soft); color:var(--good)}
.pill.inc{background:var(--signal-soft); color:var(--signal)}
.pill.lock{background:transparent; border:1px solid var(--line); color:var(--muted)}

/* nút */
.btn{font-size:13px; font-weight:500; padding:9px 15px; border-radius:7px;
  border:1px solid var(--line); background:var(--inset); color:var(--ink-2)}
.btn:hover:not(:disabled){border-color:var(--gold); color:var(--ink)}
.btn.p{background:var(--gold); border-color:var(--gold); color:#0A1026; font-weight:600}
.btn.p:hover:not(:disabled){filter:brightness(1.08)}
.btn.h{border-color:var(--gold); color:var(--gold-2); background:var(--gold-soft)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.sm{font-size:11.5px; padding:6px 11px}
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.bar .sp{flex:1}

/* thanh tiến trình */
.pbar{height:6px; border-radius:4px; background:var(--inset); overflow:hidden}
.pbar i{display:block; height:100%; background:var(--gold); border-radius:4px}
.pbar i.good{background:var(--good)}

/* trạng thái rỗng */
.empty{text-align:center; padding:34px 20px; border:1px dashed var(--line); border-radius:10px;
  background:var(--panel)}
.empty .ic{font-size:26px; opacity:.5; margin-bottom:10px}
.empty p{font-size:13.5px; color:var(--muted); margin:0 auto 14px; max-width:44ch; line-height:1.6}

/* thông báo nổi */
.toast{position:fixed; right:22px; bottom:22px; z-index:90; max-width:330px;
  background:var(--surf); border:1px solid var(--gold); border-left-width:3px; border-radius:10px;
  padding:14px 16px; box-shadow:var(--lift)}
.toast .t{font-size:13.5px; font-weight:600; color:var(--gold-2); margin-bottom:4px}
.toast .d{font-size:12.5px; color:var(--ink-2); line-height:1.5}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}

/* khối ghi chú */
.note{background:var(--panel); border-left:3px solid var(--gold); border-radius:0 8px 8px 0;
  padding:13px 15px; font-size:13px; line-height:1.6; color:var(--ink-2)}
.note.warn{border-left-color:var(--signal)}
.note.ok{border-left-color:var(--good)}
.src{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--muted); line-height:1.5}
.lbl{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted); margin:0 0 10px}

/* ══ MOBILE ═══════════════════════════════════════ */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed; left:0; top:0; z-index:60; width:var(--rail-w);
    transform:translateX(-100%); transition:transform .2s}
  .app.open .rail{transform:none; box-shadow:var(--lift)}
  .burger{display:block}
  .app.open .scrim{display:block}
  .page{padding:18px}
  .kpi.hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ══ THÀNH PHẦN RIÊNG CỦA GAME ════════════════════ */

/* thẻ nghề */
.job{width:100%; text-align:left; background:var(--surf); border:1px solid var(--line);
  border-radius:11px; padding:16px; color:var(--ink); display:block}
.job:hover{border-color:var(--gold); transform:translateY(-1px)}
.job .hd{display:flex; align-items:center; gap:8px; margin-bottom:7px; flex-wrap:wrap}
.job .nm{font-family:"Playfair Display",Georgia,serif; font-size:17px; font-weight:600; line-height:1.25}
.job .ex{font-size:13px; color:var(--ink-2); line-height:1.55; margin:0 0 12px}
.job .ft{display:flex; gap:7px; flex-wrap:wrap}

/* thẻ việc */
.task{width:100%; text-align:left; background:var(--surf); border:1px solid var(--line);
  border-radius:10px; padding:14px 16px; color:var(--ink); display:block; margin-bottom:9px}
.task:hover{border-color:var(--gold)}
.task.done{opacity:.55}
.task .hd{display:flex; gap:6px; margin-bottom:7px; flex-wrap:wrap; align-items:center}
.task .nm{font-size:14.5px; font-weight:600; line-height:1.4; margin:0 0 5px}
.task .mt{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--muted)}

/* thang cấp bậc */
.ladder{display:flex; flex-direction:column; gap:7px}
.rung{display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center;
  padding:11px 14px; border:1px solid var(--line-2); border-radius:9px; background:var(--panel)}
.rung.open{border-color:var(--gold); background:var(--gold-soft)}
.rung.cur{border-width:1.5px}
.rung .b{font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:700; color:var(--gold-2)}
.rung.lock .b{color:var(--muted)}
.rung .d{font-size:12.5px; color:var(--ink-2); line-height:1.4}
.rung .s{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--muted); white-space:nowrap}

/* biểu đồ 8 chiều */
.radar{display:flex; flex-direction:column; gap:7px}
.rr{display:grid; grid-template-columns:104px 1fr 40px; gap:11px; align-items:center}
.rr .k{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--muted); letter-spacing:.04em}
.rr .t{height:7px; background:var(--inset); border-radius:4px; overflow:hidden}
.rr .t i{display:block; height:100%; background:var(--gold); border-radius:4px}
.rr .t i.neg{background:var(--signal); margin-left:auto}
.rr .v{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink-2);
  text-align:right; font-variant-numeric:tabular-nums}
.rr .d{font-size:12.5px; color:var(--ink-2)}

/* nghề bên cạnh */
.adjr{background:var(--surf); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
.adjr .hd{display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap}
.adjr .nm{font-size:14.5px; font-weight:600}
.adjr .w{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--gold-2)}
.adjr .why{font-size:12.5px; color:var(--muted); line-height:1.55}

/* quiz */
.qn{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.11em; color:var(--gold); margin:0 0 9px}
.qp{font-family:"Playfair Display",Georgia,serif; font-size:21px; font-weight:600; line-height:1.35; margin:0 0 18px}
.qopts{display:flex; flex-direction:column; gap:10px}
.qo{width:100%; text-align:left; padding:15px 17px; border:1px solid var(--line); border-radius:10px;
  background:var(--surf); color:var(--ink); font-size:14px; line-height:1.5}
.qo:hover{border-color:var(--gold); background:var(--gold-soft)}
.field{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:12px 14px;
  background:var(--inset); color:var(--ink); font-size:14px; margin-bottom:12px}
.field:focus{outline:none; border-color:var(--gold)}

/* màn chơi */
.prog{display:flex; gap:4px; margin-bottom:18px}
.prog i{flex:1; height:3px; border-radius:2px; background:var(--line)}
.prog i.on{background:var(--gold)}
.prog i.now{background:var(--gold); opacity:.4}
.timer{display:flex; align-items:center; gap:13px; padding:11px 14px; border-radius:9px;
  background:var(--signal-soft); margin-bottom:18px}
.timer .n{font-family:"JetBrains Mono",monospace; font-size:22px; font-weight:700; color:var(--signal);
  font-variant-numeric:tabular-nums; line-height:1}
.timer .l{font-size:12.5px; color:var(--signal); line-height:1.4}
.tbar{height:4px; border-radius:2px; background:rgba(255,255,255,.14); overflow:hidden; margin-top:7px}
.tbar i{display:block; height:100%; background:var(--signal); border-radius:2px; transition:width 1s linear}
.narr{font-size:14px; line-height:1.7; color:var(--ink-2); margin:0 0 15px}
.brief{background:var(--panel); border-radius:9px; padding:15px; margin-bottom:14px;
  font-size:14px; line-height:1.7; color:var(--ink-2)}
.line{display:flex; gap:11px; margin-bottom:14px}
.av{flex:0 0 33px; height:33px; border-radius:50%; background:var(--chip); color:var(--gold-2);
  font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center}
.bub{background:var(--panel); border-radius:3px 11px 11px 11px; padding:12px 14px; flex:1;
  font-size:14px; line-height:1.6; min-width:0; overflow-wrap:anywhere}
.bub b{display:block; font-size:11.5px; color:var(--gold-2); margin-bottom:3px; font-weight:600}
.line.me{flex-direction:row-reverse}
.line.me .bub{background:var(--chip); border-radius:11px 3px 11px 11px}
.line.me .av{background:var(--inset); color:var(--muted)}
.opts{display:flex; flex-direction:column; gap:9px}
.opt{display:flex; gap:11px; width:100%; text-align:left; padding:13px 15px; border:1px solid var(--line);
  border-radius:9px; background:var(--surf); color:var(--ink); font-size:13.5px; line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .k{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--muted); flex:0 0 auto}
textarea{width:100%; border:1.5px solid var(--line); border-radius:9px; padding:12px 14px;
  background:var(--inset); color:var(--ink); font-size:14px; line-height:1.6; resize:vertical; min-height:94px}
textarea:focus{outline:none; border-color:var(--gold)}
.warn-s{font-size:11.5px; color:var(--gold); margin:10px 0 0; line-height:1.45}
.fu{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--gold-2); margin:0 0 11px}

/* ordering */
.ord{display:flex; flex-direction:column; gap:8px}
.ord-row{display:flex; align-items:stretch; gap:9px; border:1px solid var(--line);
  border-radius:9px; background:var(--surf); overflow:hidden}
.ord-n{flex:0 0 32px; display:flex; align-items:center; justify-content:center; background:var(--chip);
  font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:700; color:var(--gold-2)}
.ord-t{flex:1; padding:12px 4px 12px 2px; font-size:13.5px; line-height:1.45; align-self:center}
.ord-btns{display:flex; flex-direction:column; border-left:1px solid var(--line-2)}
.ord-btns button{flex:1; width:36px; border:none; background:none; color:var(--muted); font-size:12px; padding:0}
.ord-btns button:hover:not(:disabled){background:var(--chip); color:var(--gold-2)}
.ord-btns button:disabled{opacity:.25; cursor:not-allowed}
.ord-btns button:first-child{border-bottom:1px solid var(--line-2)}

/* prioritizing */
.pri{display:flex; flex-direction:column; gap:8px}
.pri-row{display:flex; gap:12px; width:100%; text-align:left; padding:13px 15px; border:1px solid var(--line);
  border-radius:9px; background:var(--surf); color:var(--ink); align-items:flex-start}
.pri-row:hover:not(:disabled){border-color:var(--gold)}
.pri-row[aria-pressed="true"]{border-color:var(--gold); background:var(--gold-soft)}
.pri-row:disabled{opacity:.4; cursor:not-allowed}
.pri-box{flex:0 0 19px; height:19px; border:1.5px solid var(--line); border-radius:5px; margin-top:1px;
  display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--bg)}
.pri-row[aria-pressed="true"] .pri-box{background:var(--gold); border-color:var(--gold)}
.pri-b{flex:1; min-width:0}
.pri-b .tx{font-size:13.5px; line-height:1.45; font-weight:500}
.pri-b .no{font-size:12.5px; line-height:1.45; color:var(--muted); margin-top:4px; display:block}
.pri-count{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--muted)}

/* sự kiện xen ngang + kết cục */
.evt{border:1.5px solid var(--signal); border-radius:10px; padding:15px; background:var(--signal-soft); margin-bottom:14px}
.evt .h{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.11em;

<script>
"use strict";

const LOGO = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="246" fill="#142B52" stroke="#D4B06A" stroke-width="13"/>

  <circle cx="96" cy="326" r="27" fill="#5D7EA8"/>

  <path d="M339.4 172.6 294 256l45.4 83.4L256 294l-83.4 45.4L218 256l-45.4-83.4L256 218Z" fill="#5D7EA8"/>
  <path d="M256 400 240 286h32Z" fill="#E07A6B"/>
  <path d="M256 86 285.7 226.3 426 256 285.7 285.7 256 426 226.3 285.7 86 256 226.3 226.3Z" fill="#F0D79A"/>
  <circle cx="256" cy="256" r="21" fill="#0A1026"/>
  <circle cx="256" cy="256" r="7" fill="#F8F6EE"/>
</symbol></svg>`;

/* ═══════════════════════════════════════════════════════
   NẠP DỮ LIỆU
   Không nhúng cứng. Nguồn: occupation-data/**, gói sang
   docs/data/game-data.js bằng: node docs/data/build.mjs
   Bản thật: await fetch('/api/roles') — ở đây dùng biến
   toàn cục vì trình duyệt chặn fetch() trên file:// (CORS).
   ═══════════════════════════════════════════════════════ */
const G    = window.GAME;
const DIMS = Object.keys(G.fit_dimensions);
const ROLE = c => G.roles.find(r => r.role_code === c);
const NAME = c => (ROLE(c) || {}).role_name_vn || (G.all_roles[c] || {}).name_vn || c;
const BANDS = ["L1","L2","L3","L4","L5","L6","L7","L8","L9","L10"];
const BAND_LABEL = { L1:"Thực tập sinh", L2:"Mới ra trường", L3:"Junior", L4:"Middle",
  L5:"Senior", L6:"Lead / Staff", L7:"Principal / Manager", L8:"Senior Manager", L9:"Head", L10:"C-level" };

// kịch bản sâu tra theo (nghề, cấp bậc)
const SCN = {};
for (const [k, sc] of Object.entries(G.scenarios)) SCN[sc.job.role_code + ":" + sc.job.band] = { key:k, sc };

const UNLOCK_AT = 6;                       // điểm kỹ năng cần để mở cấp bậc kế
const PTS = { "+2":2, "0":1, "-1":0 };     // mốc hành vi → điểm kỹ năng

/* ═══ CHẤM CÂU GÕ TỰ DO ═══
   Bản thật để AI đọc rồi đối chiếu ba mốc hành vi.
   Prototype thay bằng so khớp từ khoá — cùng cơ chế, khác bộ óc. */
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const has  = (s, ...ws) => ws.some(w => s.includes(norm(w)));

const GRADERS = {
  "Giải quyết vấn đề": (t, id) => {
    if (id === "a4") {
      const cause = has(t,"n+1","query","truy vấn","gọi db","batch");
      const when  = has(t,"phút","giờ","trưa","chiều","hôm nay","xong review");
      const hedge = has(t,"chưa chắc","cần kiểm","đang chờ","dự kiến","nếu","khoảng");
      return cause && when && hedge ? "+2" : (cause || when) ? "0" : "-1";
    }
    if (has(t,"tăng ram","tăng cpu","nâng cấu hình","tăng cấu hình","timeout","nới thời gian","scale up")) return "-1";
    const named = has(t,"n+1","n + 1","vòng lặp query");
    const fix   = has(t,"join","batch","eager","query in"," in (","gộp","một query","1 query","preload");
    return named && fix ? "+2" : (named || fix || has(t,"query","truy vấn")) ? "0" : "-1";
  },
  "RESTful API Design": t =>
    has(t,"trả toàn bộ","trả hết","tất cả đơn","toàn bộ lịch sử") ? "-1" :
    has(t,"phân trang","pagination","paging","limit","giới hạn","offset","cursor") ? "+2" : "0",
  "Redis": t =>
    has(t,"cache toàn bộ","cache cả response","cache hết","toàn bộ response") ? "-1" :
    has(t,"đã đóng","đã hoàn thành","cũ","không đổi","bất biến","đã xong","ttl","invalid","hết hạn","đánh đổi","stale","chưa cần") ? "+2" : "0",
  "Giao tiếp cơ bản trong team": t => {
    const what  = has(t,"500","profile","avatar","ảnh đại diện","bug","lỗi");
    const how   = has(t,"join","truy vấn","query","sửa","test","pr","pull request");
    const doubt = has(t,"chưa chắc","không chắc","anh xem","anh check","em hỏi","có đúng không","liệu","nên không");
    return what && how && doubt ? "+2" : ((what && how) || (what && doubt)) ? "0" : "-1";
  }
};
const SECRETS = {
  "SWE_BACKEND_L3_S_INCIDENT": t =>
    has(t,"giới hạn","không giới hạn","limit","phân trang") &&
    has(t,"bất kỳ","khách khác","tài khoản nào","ai cũng","sẽ lại","lặp lại","còn ai","người khác","tương tự"),
  "SWE_BACKEND_L1_S_EXEC": t =>
    has(t,"chỗ khác","endpoint khác","chỗ nào nữa","còn chỗ","rà","kiểm tra lại","tương tự","cùng kiểu","giống vậy","giống thế") &&
    has(t,"join","null","rỗng","avatar","ảnh","lỗi này","lỗi đó","bug này","kiểu này")
};
// Lời NPC cho câu đào sâu. Bản thật do AI sinh tại chỗ từ followup_goal.
const FU_LINES = {
  "SWE_BACKEND_L3_S_INCIDENT:a2":{ who:"an", text:"Chuẩn. Thế còn cái endpoint này — nó có giới hạn số đơn trả về không? Anh hỏi thật đấy." },
  "SWE_BACKEND_L3_S_INCIDENT:a3":{ who:"an", text:"Ừ. Thế nếu khách sỉ đó vẫn đặt thêm đơn mới thì phần cache kia xử lý sao?" },
  "SWE_BACKEND_L1_S_EXEC:a4":    { who:"an", text:"Ok. Thế em sửa bằng cách nào, và có chỗ nào em thấy chưa chắc không?" }
};

function gradeChoice(a,k){ return [a.optionGrade[k], (a.optionWhy||[])[k] || a.observes[0].anchors[a.optionGrade[k]]]; }
function gradeOrdering(a,o){
  const pos = id => a.correct_order.indexOf(id); let inv = 0;
  for (let x=0;x<o.length;x++) for (let y=x+1;y<o.length;y++) if (pos(o[x])>pos(o[y])) inv++;
  const an = inv===0?"+2":inv<=2?"0":"-1";
  return [an, a.observes[0].anchors[an]+` (${inv} cặp sai thứ tự)`];
}
function gradePrioritizing(a,p){
  const A=a.observes[0].anchors;
  if ((a.must_not_pick||[]).some(x=>p.includes(x))) return ["-1",A["-1"]];
  if (!(a.must_pick||[]).every(x=>p.includes(x)))   return ["-1",A["-1"]];
  return (a.should_pick||[]).some(x=>p.includes(x)) ? ["+2",A["+2"]] : ["0",A["0"]];
}

/* ═══════════════════════════════════════════════════════
   HỒ SƠ NGƯỜI CHƠI — lưu trên máy
   ═══════════════════════════════════════════════════════ */
const KEY = "vaonghe.v1";
const blankProfile = () => ({
  name:null, fit:Object.fromEntries(DIMS.map(d=>[d,0])), quizDone:false,
  skill:{},        // role_code -> { band -> điểm }
  doneTasks:[],    // "role:band:taskId"
  eventsPlayed:0
});
let P = blankProfile();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
function load(){
  try{ const r=localStorage.getItem(KEY); if(r){ P={...blankProfile(), ...JSON.parse(r)}; return true; } }catch(e){}
  return false;
}
const skillPts = (role,band) => ((P.skill[role]||{})[band]||0);
function addSkill(role,band,n){ P.skill[role]=P.skill[role]||{}; P.skill[role][band]=(P.skill[role][band]||0)+n; }
function addFit(sig){ for(const [d,v] of Object.entries(sig||{})) if(d in P.fit) P.fit[d]+=v; }

// cấp bậc nào đã mở: cấp đầu luôn mở; cấp sau mở khi cấp trước đủ điểm
function bandsOf(r){ const a=BANDS.indexOf(r.band_start), b=BANDS.indexOf(r.band_end); return BANDS.slice(a,b+1); }
function bandOpen(r,band){
  const list=bandsOf(r), k=list.indexOf(band);
  if (k<=0) return true;
  return skillPts(r.role_code, list[k-1]) >= UNLOCK_AT;
}
const hasScenario = (role,band) => !!SCN[role+":"+band];

/* ── ghép nghề từ hồ sơ 8 chiều ── */
function cosine(a,b){
  let d=0,na=0,nb=0;
  for(const k of DIMS){ d+=(a[k]||0)*(b[k]||0); na+=(a[k]||0)**2; nb+=(b[k]||0)**2; }
  return (na&&nb) ? d/Math.sqrt(na*nb) : 0;
}
const hasFit = () => DIMS.some(d=>P.fit[d]!==0);
function rankJobs(){
  if (!hasFit()) return G.roles.map(r=>({r,score:null}));
  return G.roles.map(r=>({r,score:cosine(P.fit,r.fit_profile)})).sort((x,y)=>y.score-x.score);
}
// nghề bên cạnh: trọng số đồ thị × độ khớp hồ sơ người chơi
function adjacent(roleCode){
  const r=ROLE(roleCode); if(!r) return [];
  return r.similar_ranked.map(s=>{
    const t=ROLE(s.role_code);
    const fit = (t && hasFit()) ? cosine(P.fit,t.fit_profile) : null;
    return {...s, fit, score: s.weight*(fit==null?1:(0.5+fit/2)), playable:!!t};
  }).sort((a,b)=>b.score-a.score);
}


/* ═══════════════════════════════════════════════════════
   TRẠNG THÁI PHIÊN
   ═══════════════════════════════════════════════════════ */
let V=null, TAB="ctx", SC=null, SC_KEY=null, S=null, EV=null, TOAST=null, NAVOPEN=false;
const newRun=()=>({actId:null,phase:"main",fuUsed:0,fuTotal:0,hintsUsed:[],eventsFired:[],
  plus2:0,minus1:0,evidence:[],log:[],secret:false,ending:null,rating:0,
  timer:null,deadline:0,forceEvents:false,order:null,picked:null,pendingEvent:null});
let CUR={role:null,band:null};
let QZ={i:0};

function emit(skill,anchor,why,quote,opts={}){
  let a=anchor;
  if(S.hintsUsed.includes(S.actId)&&a==="+2") a="0";        // A9 — hạ trần
  if(a==="+2") S.plus2++; else if(a==="-1") S.minus1++;
  S.evidence.push({act:S.actId,skill,anchor:a,capped:a!==anchor,why,quote:quote||null,timeout:!!opts.timeout});
}

/* ═══════════════════════════════════════════════════════
   HÀNH TINH
   Màu, vành đai, vệ tinh đều suy ra từ role_code — cùng một
   nghề thì lần nào cũng ra đúng một hành tinh.
   ═══════════════════════════════════════════════════════ */
const PAL=[
  ["#16305C","#4A7FC8"],  // xanh đêm
  ["#14454B","#3E9AA1"],  // ngọc lam
  ["#262050","#6152B8"],  // tím sao
  ["#5E4418","#D4B06A"],  // hổ phách
  ["#52251F","#C4655A"],  // gỉ sắt
  ["#1D3550","#7FA8D4"],  // băng
  ["#213F2E","#5FAE83"],  // lục rêu
];
/* cạnh nối giữa các hành tinh — chỉ giữ cạnh nằm trong nhóm đang mở.
   progresses_to (đi lên thành) mạnh hơn similar (tương tự) nên thắng khi trùng. */
const EDGES=(()=>{
  const IN=new Set(G.roles.map(r=>r.role_code)), m=new Map();
  const put=(a,b,kind)=>{ if(a===b||!IN.has(b)) return;
    const k=[a,b].sort().join("|");
    if(!m.has(k)||kind==="up") m.set(k,{a:k.split("|")[0],b:k.split("|")[1],kind}); };
  for(const r of G.roles){
    for(const x of r.similar_ranked) put(r.role_code,x.role_code,"sim");
    for(const x of r.progresses_to)  put(r.role_code,x,"up");
  }
  return [...m.values()];
})();

function drawLinks(){
  const svg=$("links"), wrap=svg&&svg.parentElement; if(!svg||!wrap) return;
  const box=wrap.getBoundingClientRect();
  const at=code=>{ const el=wrap.querySelector(`.orb[data-job="${code}"] .pl`); if(!el) return null;
    const r=el.getBoundingClientRect();
    return { x:r.left-box.left+r.width/2, y:r.top-box.top+r.height/2 }; };
  svg.setAttribute("viewBox",`0 0 ${box.width} ${box.height}`);
  svg.setAttribute("width",box.width); svg.setAttribute("height",box.height);
  svg.innerHTML=EDGES.map(e=>{
    const p=at(e.a), q=at(e.b); if(!p||!q) return "";
    const hot=CUR.role===e.a||CUR.role===e.b;
    return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"
      class="lk ${e.kind}${hot?" hot":""}"/>`;
  }).join("");
}
addEventListener("resize",()=>{ clearTimeout(window._lk); window._lk=setTimeout(drawLinks,140); });

function hash(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function planet(code,size){
  const h=hash(code), [p1,p2]=PAL[h%PAL.length];
  const ring=h%5===0||h%5===3, moon=h%3===0;
  const ang=[18,-24,42,-8,64][h%5];
  const rw=Math.round(size*1.78);
  return `<span class="pl-w" style="width:${Math.max(size,rw)}px;height:${size}px">
    ${ring?`<span class="pl-ring" style="width:${rw}px;height:${rw}px;
      --p2:${p2}"></span>`:""}
    <span class="pl" style="width:${size}px;height:${size}px;--p1:${p1};--p2:${p2};--pa:${ang}deg"></span>
    ${moon?`<span class="pl-moon" style="--p2:${p2};width:${Math.round(size*.15)}px;
      height:${Math.round(size*.15)}px;left:${Math.round(size*.06)}px;
      top:${Math.round(size*.16)}px"></span>`:""}
  </span>`;
}

  return `<div class="radar">${DIMS.map(d=>{
    const v=vec[d]||0,pct=Math.round(Math.abs(v)/mx*100);
    return `<div class="rr"><span class="k">${d}</span>

             :`<span class="t"><i class="${v<0?"neg":""}" style="width:${pct}%"></i></span>`}
      <span class="v">${v>0?"+":""}${v}</span></div>`;}).join("")}</div>`;
}

function tabTasks(r,band){

  return `${scn?"":`<div class="note warn" style="margin-bottom:16px">Hành tinh này <b>chưa có nhiệm vụ chính</b>, nên làm nhiệm vụ phụ vẫn vẽ được chân dung
      nhưng <b>chưa lên cấp bậc được</b>. Trong bản demo mới Back-end có nhiệm vụ chính.</div>`}
  ${nxt?`<div class="xp" style="margin-bottom:18px">
      <span class="lv">${band} → ${nxt}</span>
      <span class="bar"><i class="${pts>=UNLOCK_AT?"done":""}" style="width:${Math.min(100,pts/UNLOCK_AT*100)}%"></i></span>
      <span class="n">${pts}/${UNLOCK_AT}${bandOpen(r,nxt)?" ✓":""}</span>

  ${scn?`<p class="lbl">Nhiệm vụ chính — mang lại điểm kỹ năng</p>
    <button class="quest main ${done(scn.key)?"done":""}" data-scn="${scn.key}">
      <div class="hd"><span class="pill a">NHIỆM VỤ CHÍNH</span>
        <span class="pill">${scn.sc.context.scenario_archetype}</span>
        ${done(scn.key)?`<span class="pill g">đã chơi</span>`:""}</div>
      <p class="nm">${esc(scn.sc.scenario_title)}</p>
      <p class="mt">≈ ${scn.sc.context.estimated_minutes} phút · ${scn.sc.activities.length} activity ·

    <div class="hd">${(e.measures||[]).map(m=>`<span class="pill">${m}</span>`).join("")}
      ${!e.role_code?`<span class="pill">mọi nghề</span>`:""}

    <p class="nm">${esc(e.title)}</p><p class="mt">≈ 2 phút</p></button>`).join("")}`;
}

/* ═══════════════════════════════════════════════════════
   MÀN CHƠI KỊCH BẢN — giữ nguyên cơ chế đã có

function chatLog(){
  return S.log.map(l=>l.me
    ? `<div class="line me"><span class="av">Bạn</span><div class="bub">${esc(l.text)}</div></div>`
    : `<div class="line"><span class="av">${esc(l.short)}</span><div class="bub"><b>${esc(l.short)}</b>${esc(l.text)}</div></div>`).join("");
}
function npcBubble(raw,whoId){
  const nm = whoId?shortOf(whoId):(String(raw).match(/^([^:]{1,14}):/)||[,""])[1].trim().slice(0,4);
  return `<div class="line"><span class="av">${esc(nm)}</span><div class="bub"><b>${esc(nm)}</b>${esc(stripNpc(raw))}</div></div>`;
}
function vPlay(){
  const a=act(), i=actIdx();
  const prog=SC.activities.map((_,k)=>`<i class="${k<i?"on":k===i?"now":""}"></i>`).join("");
  const fu=S.phase==="followup", hinted=S.hintsUsed.includes(S.actId);
  const fuLine=FU_LINES[SC_KEY+":"+a.activity_id];
  let body="";
  if (S.phase==="closing"){
    body=`<p class="narr" style="color:var(--muted)">${esc(stripNpc(a.closing_prompt))}</p>
          <button class="btn p" id="cont">Tiếp tục</button>`;
  } else if (fu){
    body=`<textarea id="ta" placeholder="Trả lời…"></textarea>
      <div class="bar"><span style="font-size:12px;color:var(--muted)">Không có gợi ý ở câu đào sâu</span>
        <span class="sp"></span><button class="btn p" id="send">Gửi</button></div>`;
  } else if (a.type==="CHOICE"){
    body=`<div class="opts">${a.options.map((o,k)=>
      `<button class="opt" data-opt="${k}"><span class="k">${"ABCDE"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else if (a.type==="ORDERING"){
    const byId=id=>a.items.find(x=>x.item_id===id);
    body=`<div class="ord">${S.order.map((id,k)=>`<div class="ord-row">
        <span class="ord-n">${k+1}</span><span class="ord-t">${esc(byId(id).text)}</span>
        <span class="ord-btns"><button data-up="${k}" ${k===0?"disabled":""} aria-label="Lên">▲</button>
          <button data-dn="${k}" ${k===S.order.length-1?"disabled":""} aria-label="Xuống">▼</button></span>
      </div>`).join("")}</div>
      <div class="bar"><span class="sp"></span><button class="btn p" id="send">Xong</button></div>`;
  } else if (a.type==="PRIORITIZING"){
    const full=S.picked.length>=a.pick_count;
    body=`<div class="pri">${a.items.map(it=>{const on=S.picked.includes(it.item_id);
      return `<button class="pri-row" data-pick="${it.item_id}" aria-pressed="${on}" ${!on&&full?"disabled":""}>
        <span class="pri-box">${on?"✓":""}</span><span class="pri-b"><span class="tx">${esc(it.text)}</span>
        ${it.note?`<span class="no">${esc(it.note)}</span>`:""}</span></button>`;}).join("")}</div>
      <div class="bar"><span class="pri-count">đã chọn ${S.picked.length}/${a.pick_count}</span>
        ${a.hints.length&&!hinted?`<button class="btn h" id="hint">Xem gợi ý</button>`:""}
        <span class="sp"></span><button class="btn p" id="send" ${full?"":"disabled"}>Xong</button></div>
      ${a.hints.length&&!hinted?`<p class="warn">Xem gợi ý thì câu này chỉ đạt được mức trung bình.</p>`:""}`;
  } else {
    body=`<textarea id="ta" placeholder="${esc(a.input_prompt||"")}"></textarea>
      <div class="bar">${a.hints.length&&!hinted?`<button class="btn h" id="hint">Xem gợi ý</button>`:""}
        ${hinted?`<span class="warn" style="margin:0">Đã xem gợi ý — câu này tối đa mức trung bình</span>`:""}
        <span class="sp"></span><button class="btn p" id="send">Gửi</button></div>
      ${a.hints.length&&!hinted?`<p class="warn">Xem gợi ý thì câu này chỉ đạt được mức trung bình, dù bạn trả lời hay tới đâu.</p>`:""}`;
  }
  return `<div class="card reading">
    <div class="card-h"><h2 style="font-family:'Playfair Display',Georgia,serif">${esc(SC.scenario_title)}</h2>
      <span class="pill">${a.type.toLowerCase()}</span>
      <span class="m">${i+1}/${SC.activities.length}</span></div>
    <div class="card-b">
      <div class="prog">${prog}</div>
      ${a.quick_action&&S.phase==="main"?`<div class="timer"><span class="n" id="tnum">00:${a.time_limit_seconds}</span>
        <div style="flex:1"><div class="l">Hết giờ thì tính là không hành động</div>
        <div class="tbar"><i id="tbar" style="width:100%"></i></div></div></div>`:""}
      ${fu?`<p class="fu">đào sâu ${S.fuUsed}/${a.limitFollowup}</p>`:""}
      ${S.phase==="main"?`<p class="narr">${esc(a.setup)}</p>`:""}
      ${chatLog()}
      ${S.phase==="main"&&a.npc_line?npcBubble(a.npc_line):""}
      ${S.phase==="main"&&a.input_prompt&&a.type!=="FREETEXT"
        ?`<p class="narr" style="font-weight:500;color:var(--ink)">${esc(a.input_prompt)}</p>`:""}
      ${fu&&fuLine?npcBubble(fuLine.text,fuLine.who):""}
      ${body}
    </div></div>`;
}
function vEventBreak(){
  const e=S.pendingEvent;
  return `<div class="card reading"><div class="card-b">
    <div class="evt"><p class="h">Có chuyện xen vào</p><p>${esc(e.text)}</p></div>
    ${e.divert_note?npcBubble(e.divert_note.split("Kéo người chơi")[0],"an"):""}
    <button class="btn p" id="cont">${e.outcome==="EARLY_END"?"Xem kết cục":"Tiếp tục"}</button>
  </div></div>`;
}
function vEnd(){
  const e=S.ending, cls={GOOD:"",BAD:"bad",PARTIAL:"part",SECRET:"sec"}[e.type];
  const good=S.evidence.filter(x=>x.anchor==="+2"), bad=S.evidence.filter(x=>x.anchor!=="+2").slice(0,2);
  const row=x=>`<div class="di"><div class="b">${esc(x.why)}.</div>
    ${x.quote?`<div class="q">“${esc(x.quote.slice(0,130))}${x.quote.length>130?"…":""}”</div>`:""}</div>`;
  const gained=S.evidence.reduce((n,x)=>n+PTS[x.anchor],0);
  const r=ROLE(CUR.role), list=bandsOf(r), nxt=list[list.indexOf(CUR.band)+1];
  const pts=skillPts(CUR.role,CUR.band);
  return `<div class="card reading"><div class="card-b">
    <div class="endc ${cls}"><p>${esc(e.text)}</p>${e.reveals?`<p class="rv">${esc(e.reveals)}</p>`:""}</div>
    ${good.length?`<div class="deb ok"><p class="h">Bạn đã làm tốt</p>${good.map(row).join("")}</div>`:""}
    ${bad.length?`<div class="deb no"><p class="h">Lần sau chú ý</p>${bad.map(row).join("")}</div>`:""}
    <div class="note-b"><b>+${gained} điểm kỹ năng</b> ở ${CUR.band}. Tổng đang có: <b>${pts}</b>.
      ${nxt?(bandOpen(r,nxt)?` Đủ để mở <b style="color:var(--good)">${nxt}</b>.`
        :` Cần <b>${UNLOCK_AT}</b> để mở ${nxt}.`):""}</div>
    <div class="rate"><p>Tình huống này có giống thực tế không?</p>
      <div class="stars">${[1,2,3,4,5].map(n=>
        `<button class="st ${n<=S.rating?"on":""}" data-star="${n}" aria-label="${n} sao">★</button>`).join("")}</div>
      ${S.rating?`<p style="font-size:12.5px;color:var(--muted);margin:10px 0 0">Cảm ơn bạn. Đánh giá này dùng để lọc tình huống dở, không ảnh hưởng tới kết quả của bạn.</p>`:""}
    </div>
    <div class="bar" style="margin-top:18px"><button class="btn p" id="toProfile">Xem hành trang</button>
      <button class="btn" id="toTasks">Nhiệm vụ khác</button>
      <button class="btn" id="again">Chơi lại</button></div>
  </div></div>`;
}



/* ═══════════════════════════════════════════════════════
   GẮN SỰ KIỆN
   ═══════════════════════════════════════════════════════ */
function wire(){
  const on=(id,fn)=>{const el=$(id); if(el) el.onclick=fn;};
  const each=(sel,fn)=>document.querySelectorAll(sel).forEach(fn);

  // khung
  // data-nav co the kem data-tab: dieu huong xong thi mo dung tab.
  // Phai gan TRUOC handler [data-tab] va handler do phai bo qua phan tu co data-nav,
  // neu khong no ghi de onclick va nut thanh vo tac dung.
  each("[data-nav]",b=>b.onclick=e=>{ e.preventDefault(); const t=b.dataset.nav;
    if(t==="quiz"){ QZ.i=0; go("quiz"); return; }
    if(t==="job"&&!CUR.role){ go("jobs"); return; }
    go(t, b.dataset.tab); });
  on("burger",()=>{ NAVOPEN=!NAVOPEN; render(); });
  on("scrim",()=>{ NAVOPEN=false; render(); });
  each("[data-tab]:not([data-nav])",b=>b.onclick=()=>{ TAB=b.dataset.tab; render(); });

  // đăng ký
  on("signup",()=>{ const v=($("nm").value||"").trim();
    if(!v){ $("nm").focus(); return; } P.name=v.slice(0,24); save(); QZ.i=0; go("quiz"); });
  on("cont2",()=>go(P.quizDone||hasFit()?"dashboard":"quiz"));
  on("reset2",()=>{ localStorage.removeItem(KEY); P=blankProfile(); CUR={role:null,band:null}; go("signup"); });

  // quiz
  each("[data-qo]",b=>b.onclick=()=>{
    const q=G.quiz.questions[QZ.i];
    addFit((q.options.find(o=>o.option_id===b.dataset.qo)||{}).signal);
    QZ.i++;
    if(QZ.i>=G.quiz.questions.length){ P.quizDone=true; save(); go("quizDone"); } else render(); });
  on("skipQuiz",()=>{ P.quizDone=true; save(); go("jobs"); });

  // nghề và việc
  each("[data-job]",b=>b.onclick=()=>{ const r=ROLE(b.dataset.job); if(!r) return;
    CUR={role:r.role_code,band:r.band_start}; go("job","ctx"); });
  each("[data-scn]",b=>b.onclick=()=>openScenario(b.dataset.scn));
  each("[data-ev]",b=>b.onclick=()=>openEvent(b.dataset.ev));
  each("[data-evc]",b=>b.onclick=()=>answerEvent(+b.dataset.evc));

  // chơi kịch bản
  on("again",()=>openScenario(SC_KEY));
  each("[data-star]",b=>b.onclick=()=>{ S.rating=+b.dataset.star; render(); });
  each("[data-opt]",b=>b.onclick=()=>answerChoice(+b.dataset.opt));
  each("[data-up]",b=>b.onclick=()=>moveItem(+b.dataset.up,-1));
  each("[data-dn]",b=>b.onclick=()=>moveItem(+b.dataset.dn,1));
  each("[data-pick]",b=>b.onclick=()=>togglePick(b.dataset.pick));
  on("cont",()=>S.pendingEvent?afterEvent():afterClosing());
  on("hint",()=>{ const a=act(); S.hintsUsed.push(S.actId);
    S.log.push({me:false,short:"An",text:stripNpc(a.hints[0].text)}); render(); });
  on("send",()=>{ const a=act();
    if(a.type==="ORDERING"&&S.phase==="main") return answerOrdering();
    if(a.type==="PRIORITIZING"&&S.phase==="main") return answerPrioritizing();
    const ta=$("ta"), t=(ta.value||"").trim();
    if(t.length<2){ ta.focus(); return; } answerText(t); });

  if(V==="play"&&act().quick_action&&S.phase==="main") runTimer();
}

/* ═══════════════════════════════════════════════════════
   LUỒNG CHƠI
   ═══════════════════════════════════════════════════════ */
function openEvent(id){
  const r=ROLE(CUR.role);
  EV=[...r.events,...G.shared_events].find(e=>e.event_id===id);
  go("ev");
}
function answerEvent(k){
  EV._picked=k;
  addFit(EV.choices[k].signal);
  const key=taskKey(CUR.role,CUR.band,EV.event_id);
  if(!P.doneTasks.includes(key)){ P.doneTasks.push(key); P.eventsPlayed++; }
  save(); go("evEnd");
}

function openScenario(key){
  SC=G.scenarios[key]; SC_KEY=key; S=newRun();
  startActivity(SC.activities.find(a=>a.isOrigin).activity_id);
}
function startActivity(id){
  stopTimer();
  S.actId=id; S.phase="main"; S.fuUsed=0; S.log=[];
  const a=act();
  if(a.type==="ORDERING"){
    const n=a.items.length, perm=[2,0,4,1,3].filter(x=>x<n);
    for(let k=0;k<n;k++) if(!perm.includes(k)) perm.push(k);
    S.order=perm.map(k=>a.items[k].item_id);
  } else S.order=null;
  S.picked=a.type==="PRIORITIZING"?[]:null;
  go("play");
}
function moveItem(k,d){ const t=S.order[k]; S.order[k]=S.order[k+d]; S.order[k+d]=t; render(); }
function togglePick(id){ const a=act();
  S.picked=S.picked.includes(id)?S.picked.filter(x=>x!==id)
    :S.picked.length<a.pick_count?[...S.picked,id]:S.picked; render(); }

function runTimer(){
  stopTimer();
  const a=act(), total=a.time_limit_seconds;
  S.deadline=Date.now()+total*1000;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((S.deadline-Date.now())/1000));
    const n=document.getElementById("tnum"), bar=document.getElementById("tbar");
    if(!n){ stopTimer(); return; }
    n.textContent="00:"+String(left).padStart(2,"0");
    bar.style.width=(left/total*100)+"%";
    if(left<=0){ stopTimer(); onTimeout(); }
  };
  tick(); S.timer=setInterval(tick,250);
}
function onTimeout(){
  const a=act();
  emit(a.observes[0].skill,"-1","Hết giờ mà chưa hành động — sự cố không tự đợi",null,{timeout:true});
  S.log.push({me:true,text:"(không kịp phản ứng)"});
  S.phase="closing"; render();
}
const finishActivity=()=>{ S.phase="closing"; render(); };

function answerChoice(k){
  stopTimer();
  const a=act(), [an,why]=gradeChoice(a,k);
  emit(a.observes[0].skill,an,why,a.options[k]);
  S.log.push({me:true,text:a.options[k]}); finishActivity();
}
function answerOrdering(){
  const a=act(), [an,why]=gradeOrdering(a,S.order);
  const txt=S.order.map((id,i)=>`${i+1}. ${a.items.find(x=>x.item_id===id).text}`).join(" · ");
  emit(a.observes[0].skill,an,why,txt); S.log.push({me:true,text:txt}); finishActivity();
}
function answerPrioritizing(){
  const a=act(), [an,why]=gradePrioritizing(a,S.picked);
  const txt=S.picked.map(id=>a.items.find(x=>x.item_id===id).text).join(" · ");
  emit(a.observes[0].skill,an,why,txt); S.log.push({me:true,text:txt}); finishActivity();
}
function answerText(t){
  const a=act(), low=norm(t);
  S.log.push({me:true,text:t});
  const sec=SECRETS[SC_KEY]; if(sec&&sec(low)) S.secret=true;
  const fu=S.phase==="followup"; let missed=null;
  for(const o of a.observes){
    const g=GRADERS[o.skill];
    const an=g?g(low,a.activity_id):(t.length>90?"0":"-1");
    const why=o.anchors[an];
    if(fu){
      const prev=S.evidence.filter(x=>x.act===a.activity_id&&x.skill===o.skill).pop();
      if(prev&&rank(an)>rank(prev.anchor)){
        if(prev.anchor==="+2") S.plus2--; if(prev.anchor==="-1") S.minus1--;
        S.evidence=S.evidence.filter(x=>x!==prev);
        emit(o.skill,an,why,t);
      }
      continue;
    }
    emit(o.skill,an,why,t);
    if(an!=="+2"&&!missed) missed=o.skill;
  }
  const hasLine=!!FU_LINES[SC_KEY+":"+a.activity_id];
  if(!fu&&missed&&hasLine&&S.fuUsed<a.limitFollowup&&S.fuTotal<fuCap(SC.job.band)){
    S.phase="followup"; S.fuUsed++; S.fuTotal++; render(); return;
  }
  finishActivity();
}
const rank=a=>({"-1":0,"0":1,"+2":2}[a]);

function afterClosing(){
  const a=act();
  const e=(SC.random_events||[]).find(ev=>ev.after_activity===a.activity_id&&!S.eventsFired.includes(ev.event_id));
  if(e){
    const condOk=!e.condition||e.condition.min_minus1==null||S.minus1>=e.condition.min_minus1;
    if(condOk&&(S.forceEvents||Math.random()<e.chance)){
      S.eventsFired.push(e.event_id); S.pendingEvent=e; go("event"); return;
    }
  }
  advance();
}
function afterEvent(){
  const e=S.pendingEvent; S.pendingEvent=null;
  if(e.outcome==="EARLY_END") return finish(SC.endings.find(x=>x.ending_id===e.early_ending_id));
  advance();
}
function advance(){
  const a=act();
  if(a.forward_to==="END") return finish(pickEnding());
  startActivity(a.forward_to);
}
function pickEnding(){
  return [...SC.endings].sort((x,y)=>x.priority-y.priority).find(e=>{
    const c=e.condition;
    if(c.extra&&!S.secret) return false;
    if(c.min_plus2!=null&&S.plus2<c.min_plus2) return false;
    if(c.max_minus1!=null&&S.minus1>c.max_minus1) return false;
    return true;
  });
}
function finish(e){
  stopTimer(); S.ending=e;
  const key=taskKey(CUR.role,CUR.band,SC_KEY);
  if(!P.doneTasks.includes(key)){                       // chỉ tính điểm lần chơi đầu
    P.doneTasks.push(key);
    addSkill(CUR.role,CUR.band,S.evidence.reduce((n,x)=>n+PTS[x.anchor],0));
  }
  save(); go("end");
}


/* ═══ khởi động ═══ */
load();
go("signup");
</script>
