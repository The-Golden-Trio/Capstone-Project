    - {chuong: 2, mo_o: than, len_muc: gan_bo, id: 0_don_tro, tom_tat: 'Phụ Hân dọn sang phòng trọ mới, tìm chỗ gửi Bánh Bao', cao_trao: Hân lỡ nói sợ lần này lại bỏ ngang}
    - {chuong: 3, mo_o: gan_bo, len_muc: tri_ky, id: 0_an_khuya, tom_tat: Hân nhắn rủ đi ăn khuya sau một ngày tệ ở chỗ làm, cao_trao: 'Hân quyết ở lại một việc khó, nhờ người chơi nhắc
        nếu Hân định bỏ'}
