                type: string
              voice:
                type: string
        activities:
          type: array
          minItems: 3
          maxItems: 4
          items:
            type: object
            required:
              - key
              - inputPrompt
              - jobScope
              - closingLine
              - allowedTypes
              - rubric
            properties:
              key:
                type: string
              isOrigin:
                type: boolean
              forwardTo:
                type:
                  - string
                  - 'null'
              setup:
                type: string
              npcLine:
                type: string
