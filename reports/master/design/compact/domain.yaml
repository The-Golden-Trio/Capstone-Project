# Enumerations. "values" come from a cited source; any enum-like column not listed here is drawn as
# `String «enum?»`, meaning the ERD and research name no values yet.
enums:
  Role:
    use: [USER_ACCOUNT.roles, ASSIGNED_TO.role]
    values: [EXPLORER, DOMAIN_EXPERT, CONTENT_ADMIN, SYSTEM_ADMIN]
    source: "apps/api/prisma/schema.prisma UserRoleKind; A22"
  AccountStatus:
    use: [USER_ACCOUNT.status]
    values: [ACTIVE, DISABLED, DELETED]
    source: "schema.prisma AccountStatus"
  ScenarioStatus:
    use: [SCENARIO.status, LIFECYCLE_LOG.from_status, LIFECYCLE_LOG.to_status]
    values: [DRAFT, SUBMITTED, IN_REVIEW, APPROVED, IN_PLAYTEST, READY, PUBLISHED, RETIRED]
    source: "SM-01"
  ReviewDecision:
    use: [REVIEW.decision]
    values: [APPROVE, REQUEST_CHANGES, REJECT]
    source: "SD-06, schema.prisma ReviewDecision"
  CriterionAnswer:
    use: [ANSWERS_CRITERION.answer]
    values: [MET, NOT_MET]
    source: "schema.prisma CriterionVerdict"
  AssignmentStatus:
    use: [REVIEW_ASSIGNMENT.status]
    values: [ACTIVE, COMPLETED, REASSIGNED]
    source: "schema.prisma AssignmentStatus"
  AssetKind:
    use: [ASSET.kind]
    values: [NPC, BACKGROUND, SCENE, ICON]
    source: "schema.prisma AssetKind"
  AssetSource:
    use: [ASSET.source]
    values: [LIBRARY, LICENSED, AI_GENERATED]
    source: "schema.prisma AssetSource"
  BiasCheckStatus:
    use: [ASSET.bias_check.status]
    values: [PENDING, PASSED, FAILED]
    source: "schema.prisma BiasCheckStatus"
  RunStatus:
    use: [SCENARIO_RUN.status]
    values: [IN_PROGRESS, FINISHED, ABANDONED]
    source: "schema.prisma RunStatus"
  Proficiency:
    use: [TRAINS.proficiency, EARNED_KEYWORD.proficiency]
    values: [FAMILIAR, PROFICIENT, EXPERT]
    source: "schema.prisma Proficiency; D-118"
  RiasecAxis:
    use: [GTKM_CARD.riasec_axis, NODE.riasec_axis, INTEREST_TAP.axis]
    values: [R, I, A, S, E, C]
    source: "D-104 (6 RIASEC axes)"
  SideActivityKind:
    use: [SIDE_ACTIVITY.kind]
    values: [COFFEE, MEAL, TICKET, GROUP_TRIP]
    source: "ERD comment on SIDE_ACTIVITY"
  ZodiacElement:
    use: [ZODIAC_SIGN.element]
    values: [FIRE, EARTH, AIR, WATER]
    source: "Hoàng đạo 12 cung"
  ZodiacModality:
    use: [ZODIAC_SIGN.modality]
    values: [CARDINAL, FIXED, MUTABLE]
    source: "Hoàng đạo 12 cung"
# Columns whose value is a 0..2 or 0..3 scale rather than an enum.
scales:
  ASSESSMENT.level: "0..2  D-116"
  JUDGE_RESULT.level: "0..2  D-116"
  SCORES.level: "0..2  D-116"
  REF_GRADE.level: "0..2  D-116"
  BLIND_RATING.level: "0..2  D-116"
  REFERENCE_REGRADE.level: "0..2  D-116"
  ANSWERS_CARD.value: "1..3  D-104"
  INTEREST_TAP.value: "1..3  D-106"
  SCORES_ATTR.score: "1..5  FR-19"
  SKILL_TIER.tier: "0..5  D-114"
  PROGRESSES.tier: "0..5  D-114"
  EXPLORER_GOAL.baseline_tier: "0..5  D-114"
# Column names that are enum-like when no enum above covers them.
enum_candidates: [status, kind, role, type, source, decision, result, tier, relation, visibility, format, channel,
                  provider, family, section, selection, gender, review_status, unlock_route, draw_kind,
                  trigger_kind, finish_reason, shifts, overtime, skill_type, box, grade, response, match_method,
                  entry_route, onboard_kind, company_choice, item_group, rarity, price_unit, decor_slot, gift_group,
                  buff_kind, branch_group, domain, stage, address_form, situation_type, player_role, stance,
                  default_channel, disclosure_style, layer, difficulty_stratum, difficulty_tier, health_tier,
                  basis, evidence_grade, weight_status, name_vi_status, judge_slot, source_kind, flags]

# Domain behaviour (the ERD has none). Each method has a source and is a rule, not an invented feature.
# Implementation notes: the data of a class is the Prisma model; a pure rule lives in packages/game-core,
# a rule that touches the database lives in the service that owns the table (see CL-0x).
methods:
  USER_ACCOUNT:
    - "+hasRole(role: Role) : Boolean"
  EXPLORER:
    - "+addSkillPoints(group: SoftSkillGroup, raw: Int) : Int  «D-113 +12%, D-114 cap 10.000»"
    - "+currentBalance() : Int  «D-133 ledger is append-only»"
  XU_TRANSACTION: []
  SKILL_TIER:
    - "+tierFor(points: Int) : Int  «D-114»"
  SCENARIO:
    - "+apply(action: LifecycleAction) : LifecycleLog  «SM-01»"
  SCENARIO_RELEASE: []
  SCENARIO_RUN:
    - "+append(event: RunEvent) : void  «SD-01, run = append-only events»"
    - "+fold() : RunState  «§5.3.1, game-core»"
    - "+finish() : void  «SD-02»"
    - "+startOvertime() : void  «D-133 at most 2 per scene»"
  ASSESSMENT:
    - "+combine(judges: JudgeResult[]) : Int  «D-116, D-132»"
  SCENARIO_BEST:
    - "+recordRun(run: ScenarioRun) : Int  «D-119 pay only the difference»"
  REVIEW_ASSIGNMENT:
    - "+reassign(to: StaffMember) : ReviewAssignment  «SD-06»"
  GTKM_ATTEMPT:
    - "+complete() : void  «FR-04, no AI call»"
  KNOWS:
    - "+addIntimacy(points: Int) : void  «D-133 never decreases»"
  INVENTORY_ITEM:
    - "+use(run: ScenarioRun) : void  «D-133 one buff item per scene, total buff capped +50%»"
  AI_JOB:
    - "+retry() : void  «D-92 switch model of the same role»"
