    - {quan_he: ngoai_gio, bieu_cam: cuoi_lon, text: Bánh Bao nhà tui bữa nay leo lên tủ lạnh ngủ luôn á.}
    - {quan_he: ngoai_gio, tu_muc: gan_bo, bieu_cam: buon, text: Tui hay bỏ ngang lắm. Lần này tui không muốn vậy nữa.}
    xung_ho:
      tu_muc_than: {muc: than, goi: '{ten}'}
      goi_du_phong: bạn
    do_rieng: Móc khoá hình con mèo
    qua:
