                type: string
              jobScope:
                type: string
              closingLine:
                type: string
              allowedTypes:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/TaskType'
              items:
                type: array
                description: Closed options with expert scores; closed answers are never penalised
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    text:
                      type: string
                    score:
                      $ref: '#/components/schemas/Score'
                    why:
                      type: string
                    correctPosition:
                      type: integer
                    pickRule:
                      type: string
                      enum:
                        - MUST
                        - SHOULD
                        - MUST_NOT
                        - NEUTRAL
                    note:
                      type: string
              followupLimit:
                type: integer
                minimum: 0
                maximum: 4
              followupGoal:
                type: string
              defaultFollowup:
                type: string
              hints:
                type: array
                description: NPC lines; viewing one never lowers the score (FR-13)
                items:
                  type: string
              rubric:
                type: array
                minItems: 1
                description: What the judges observe in free-text answers (D-116)
                items:
                  type: object
                  required:
                    - competencyId
                    - anchor2
                    - anchor1
                    - anchor0
                  properties:
                    competencyId:
                      type: string
                      format: uuid
                    anchor2:
                      type: string
                      description: Observable behaviour for level 2 (done well)
                    anchor1:
                      type: string
                      description: Observable behaviour for level 1 (meets)
                    anchor0:
                      type: string
                      description: Observable behaviour for level 0 (not yet)
                    counterproductiveSigns:
                      type: string
                      description:
                        Behaviour that raises the counterproductive flag, e.g. blaming or insulting; the flag
                        is kept apart from the level and costs the band penalty
