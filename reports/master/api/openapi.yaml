openapi: 3.1.0
info:
  title: JobQuest API
  version: 1.0.0
  summary: REST API of the JobQuest platform for explorers, domain experts, content administrators and system administrators.
  description:
    "JobQuest lets explorers try occupations through scenarios written by domain experts and graded by a panel\
    \ of three AI judges.\n\n**Conventions**\n- All paths start with `/api/v1`. Bodies are JSON (UTF-8) unless stated otherwise.\n\
    - Authentication: bearer access token from `/auth/*`. Each operation lists the roles allowed in `x-roles`.\n  Staff routes\
    \ also check that the caller is assigned to the occupation concerned (FR-41).\n- Errors follow Problem Details (RFC 9457)\
    \ with a stable `code`, e.g. `SCENARIO_UNAVAILABLE`.\n- Long AI work (grading, follow-ups, generation, suggestions, assets)\
    \ returns `202 Accepted` with a job id.\n  The result arrives on the event stream `GET /stream` (Server-Sent Events),\
    \ opened by the screens that wait for it.\n- Scenario state changes are action endpoints that follow SM-01; an action\
    \ not allowed in the current state returns `409 INVALID_TRANSITION`.\n- All content and messages are in Vietnamese; there\
    \ is no language selection.\n- Rubric levels are 0 / 1 / 2 (D-116). Only free-text answers graded by the judges can\
    \ carry a counterproductive flag, which costs a penalty; closed answers are never penalised and a viewed hint never\
    \ lowers a score.\n- AI models and platform settings (cost ceiling, rating threshold, idle timeout) come from\
    \ the deployment config, not from the API; the active model set is recorded at start-up (FR-42).\n- Server metrics (CPU,\
    \ memory, disk, network, uptime) are not part of this API: Prometheus scrapes `GET /metrics` of the API and worker apps\
    \ on the internal network and Grafana shows them. `/admin/metrics` covers only usage, AI cost and AI errors (FR-43).\n\
    - `x-fr` and `x-sd` link each operation to the functional requirements and sequence diagrams of the report.\n"
  contact:
    name: JobQuest team
servers:
  - url: /api/v1
    description: Same origin as the web apps
tags:
  - name: Auth
    description: Registration, sign-in and password recovery (FR-01, FR-02)
  - name: Me
    description: The signed-in explorer's account and private record (FR-02, FR-18)
  - name: Quiz
    description: Get-to-know-me quiz (FR-03, FR-04)
  - name: Catalogue
    description: Galaxy Map, occupation profiles and levels (FR-05 – FR-08, FR-17, FR-19)
  - name: Play
    description: Enrolment, scenario runs, answers, hints and summaries (FR-08 – FR-16)
  - name: Feedback
    description: Occupation ratings and app feedback (FR-19, FR-20)
  - name: Stream
    description: Server-Sent Events for AI and job results, opened by the screens that wait for them
  - name: Staff · Catalogue
    description: Domains, occupations, imports and review criteria — Content Admin (FR-30 – FR-32, FR-39)
  - name: Staff · Profile
    description: Occupation profile — Domain Expert (FR-21)
  - name: Staff · Authoring
    description: Opening, assigning, generating and submitting scenarios (FR-22 – FR-24, FR-33, FR-34)
  - name: Staff · Review
    description: Review, reassignment and revalidation (FR-25, FR-27, FR-34)
  - name: Staff · Presentation
    description: Gamify, assets, draft game and play-test (FR-26, FR-35, FR-36)
  - name: Staff · Release
    description: Publish and delete scenarios (FR-37, FR-38)
  - name: Staff · Quality
    description: Flagged content, blind rating and grading agreement (FR-14, FR-28, FR-29)
  - name: Staff · AI prompts
    description: System prompts of an occupation, written together by its Content Admin and Domain Experts (FR-44)
  - name: Admin
    description: Accounts, staffing, monitoring and app feedback (FR-20, FR-40, FR-41, FR-43)
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Register an explorer account
      security: []
      x-roles:
        - PUBLIC
      x-fr:
        - FR-01
      x-sd:
        - SD-04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-screens:
        - E02 Sign in / Register
  /auth/sign-in:
    post:
      tags:
        - Auth
      operationId: signIn
      summary: Sign in with e-mail and password
      description: Shared sign-in screen for explorers and staff. Disabled accounts are refused.
      security: []
      x-roles:
        - PUBLIC
      x-fr:
        - FR-01
        - FR-41
      x-sd:
        - SD-04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInInput'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-screens:
        - E02 Sign in / Register
        - T01 Staff sign in
  /auth/google:
    post:
      tags:
        - Auth
      operationId: signInWithGoogle
      summary: Sign in with Google
      description: Exchanges the authorization code, verifies the ID token, then finds or creates the linked account.
      security: []
      x-roles:
        - PUBLIC
      x-fr:
        - FR-01
      x-sd:
        - SD-04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInWithGoogleInput'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-screens:
        - E02 Sign in / Register
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshSession
      summary: Get a new access token
      security: []
      x-roles:
        - PUBLIC
      x-fr:
        - FR-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionInput'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-screens:
        - E00 App shell (every signed-in screen)
        - T00 Staff app shell (every screen)
  /auth/sign-out:
    post:
      tags:
        - Auth
      operationId: signOut
      summary: Sign out and revoke the session
      x-roles:
        - EXPLORER
        - DOMAIN_EXPERT
        - CONTENT_ADMIN
        - SYSTEM_ADMIN
      x-fr:
        - FR-02
      responses:
        '204':
          description: Signed out
      x-screens:
        - E15 Account settings
  /auth/password-reset:
    post:
      tags:
        - Auth
      operationId: requestPasswordReset
      summary: Send a single-use password reset link
      description: Always returns 202 so the response does not reveal whether the e-mail exists.
      security: []
      x-roles:
        - PUBLIC
      x-fr:
        - FR-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetInput'
      responses:
        '202':
          description: Request accepted
      x-screens:
        - E02 Sign in / Register
        - T01 Staff sign in
  /auth/password-reset/confirm:
    post:
      tags:
        - Auth
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      security: []
      x-roles:
        - PUBLIC
      x-fr:
        - FR-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordResetInput'
      responses:
        '204':
          description: Password changed
        '410':
          $ref: '#/components/responses/Gone'
      x-screens:
        - E02 Sign in / Register
        - T01 Staff sign in
  /me:
    get:
      tags:
        - Me
      operationId: getMe
      summary: Get the signed-in account, top-bar points and quiz status
      x-roles:
        - EXPLORER
        - DOMAIN_EXPERT
        - CONTENT_ADMIN
        - SYSTEM_ADMIN
      x-fr:
        - FR-18
      x-sd:
        - SD-04
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
      x-screens:
        - E00 App shell (every signed-in screen)
        - E03 Galaxy Map (Home)
        - T01 Staff sign in
    patch:
      tags:
        - Me
      operationId: updateMe
      summary: Edit account details or password
      x-roles:
        - EXPLORER
        - DOMAIN_EXPERT
        - CONTENT_ADMIN
        - SYSTEM_ADMIN
      x-fr:
        - FR-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeInput'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-screens:
        - E15 Account settings
    delete:
      tags:
        - Me
      operationId: deleteMe
      summary: Delete the explorer account and personal data
      x-roles:
        - EXPLORER
      x-fr:
        - FR-02
        - NFR-05
      responses:
        '204':
          description: Account deleted
      x-screens:
        - E15 Account settings
  /me/record:
    get:
      tags:
        - Me
      operationId: getMyRecord
      summary: Get the private record of attempts, points and awards
      x-roles:
        - EXPLORER
      x-fr:
        - FR-18
      x-sd:
        - SD-02
      responses:
        '200':
          description: Private record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateRecord'
      x-screens:
        - E14 Profile
  /me/feedback:
    get:
      tags:
        - Me
      operationId: listMyPastFeedback
      summary: List end-of-scenario feedback of past attempts
      x-roles:
        - EXPLORER
      x-fr:
        - FR-18
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Past feedback, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ScenarioSummary'
      x-screens:
        - E14 Profile
  /quiz/questions:
    get:
      tags:
        - Quiz
      operationId: getQuizQuestions
      summary: Get the RIASEC questions
      x-roles:
        - EXPLORER
      x-fr:
        - FR-03
      x-sd:
        - SD-03
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizQuestion'
      x-screens:
        - E04 Get-to-know-me quiz
  /quiz/attempts:
    post:
      tags:
        - Quiz
      operationId: submitQuiz
      summary: Submit quiz answers and get the portrait and five suggestions
      description:
        No AI is used. The profile is calculated from the answers, five occupations are matched by O*NET interest
        code, and the fixed portrait for the highest-scoring type is returned. A retake replaces the current result.
      x-roles:
        - EXPLORER
      x-fr:
        - FR-03
        - FR-04
      x-sd:
        - SD-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuizInput'
      responses:
        '201':
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResult'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-screens:
        - E04 Get-to-know-me quiz
  /quiz/attempts/current:
    get:
      tags:
        - Quiz
      operationId: getCurrentQuizResult
      summary: Get the current quiz result
      x-roles:
        - EXPLORER
      x-fr:
        - FR-03
        - FR-04
      responses:
        '200':
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResult'
        '404':
          $ref: '#/components/responses/NotFound'
      x-screens:
        - E05 Quiz result
  /occupations:
    get:
      tags:
        - Catalogue
      operationId: listOccupations
      summary: Get the Galaxy Map
      x-roles:
        - EXPLORER
      x-fr:
        - FR-05
      responses:
        '200':
          description: Published occupations grouped by domain
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainOnMap'
      x-screens:
        - E03 Galaxy Map (Home)
  /occupations/{occupationId}:
    parameters:
      - $ref: '#/components/parameters/OccupationId'
    get:
      tags:
        - Catalogue
      operationId: getOccupationProfile
      summary: Get an occupation profile with downsides, career path and ratings
      x-roles:
        - EXPLORER
      x-fr:
        - FR-05
        - FR-17
        - FR-19
        - NFR-06
      responses:
        '200':
          description: Occupation profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupationProfile'
        '404':
          $ref: '#/components/responses/NotFound'
      x-screens:
        - E06 Occupation profile
  /occupations/{occupationId}/levels/{levelNo}:
    parameters:
      - $ref: '#/components/parameters/OccupationId'
      - $ref: '#/components/parameters/LevelNo'
    get:
      tags:
        - Catalogue
      operationId: getLevel
      summary: Get a level description and the caller's access
      description:
        The entry level is always open (FR-06). A higher level is open when unlocked or offered through adjacency
        (FR-07).
      x-roles:
        - EXPLORER
      x-fr:
        - FR-05
        - FR-06
        - FR-07
        - FR-08
      responses:
        '200':
          description: Level and access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelView'
        '404':
          $ref: '#/components/responses/NotFound'
      x-screens:
        - E07 Level selection
  /enrolments:
    post:
      tags:
        - Play
      operationId: enrol
      summary: Enrol in a level
      x-roles:
        - EXPLORER
      x-fr:
        - FR-06
        - FR-07
        - FR-08
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolInput'
      responses:
        '201':
          description: Enrolled; returns the Island Map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IslandMap'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-screens:
        - E07 Level selection
  /enrolments/{enrolmentId}:
    parameters:
      - name: enrolmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Play
      operationId: getIslandMap
      summary: Get the Island Map of an enrolment
      x-roles:
        - EXPLORER
      x-fr:
        - FR-08
        - FR-16
      responses:
        '200':
          description: Level progress, main quests, side quests and suggested tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IslandMap'
        '404':
          $ref: '#/components/responses/NotFound'
      x-screens:
        - E08 Island Map
  /runs:
    post:
      tags:
        - Play
      operationId: startRun
      summary: Start or resume a main quest
      description:
        Resumes the run in progress for the same task if one exists (NFR-03). An unavailable scenario returns 409
        SCENARIO_UNAVAILABLE and the app returns to the Island Map.
      x-roles:
        - EXPLORER
      x-fr:
        - FR-08
        - FR-09
        - NFR-03
      x-sd:
        - SD-08
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunInput'
      responses:
        '201':
          description: Run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '200':
          description: Existing run resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '409':
          $ref: '#/components/responses/Conflict'
      x-screens:
        - E08 Island Map
  /runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags:
        - Play
      operationId: getRun
      summary: Get a run with its intro, release version and saved position
      x-roles:
        - EXPLORER
        - DOMAIN_EXPERT
      x-fr:
        - FR-09
        - NFR-03
      x-sd:
        - SD-08
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/NotFound'
      x-screens:
        - E10 Scenario intro
        - D05 Play-test
  /runs/{runId}/activity:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags:
        - Play
      operationId: getCurrentActivity
      summary: Open the current activity
      description: Returns the activity, its NPC and, when the system rolls one, a random event shown as the activity opens.
      x-roles:
        - EXPLORER
        - DOMAIN_EXPERT
      x-fr:
        - FR-10
        - FR-22
      x-sd:
        - SD-01
      responses:
        '200':
          description: Current activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityView'
        '409':
          $ref: '#/components/responses/Conflict'
      x-screens:
        - E11 Scenario play
        - D05 Play-test
  /runs/{runId}/answers:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags:
        - Play
      operationId: submitAnswer
      summary: Submit an answer to an activity, follow-up or random event
      description:
        'The client creates `answerId`; posting the same id again returns the stored result (NFR-04).

        - Closed answers are scored at once from the expert option scores (0 / 1 / 2, never penalised) → `200`.

        - Free-text answers are stored and queued for the three-judge panel → `202`. The level, any counterproductive flag,
        any follow-up and the closing line arrive on `/stream`.

        - An answer that breaks the activity rules → `422 ANSWER_INVALID` with reasons.

        '
      x-roles:
        - EXPLORER
        - DOMAIN_EXPERT
      x-fr:
        - FR-10
        - FR-11
        - FR-12
        - FR-15
        - NFR-01
        - NFR-02
        - NFR-04
      x-sd:
        - SD-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInput'
      responses:
        '200':
          description: Closed answer scored, or a repeated post of an answer already stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResult'
        '202':
          description: Free-text answer saved and queued for grading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-screens:
        - E11 Scenario play
        - D05 Play-test
  /runs/{runId}/hints:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags:
        - Play
      operationId: viewHint
      summary: View the hint of the current activity
      description: Records that the hint was viewed. A viewed hint never lowers the activity score (FR-13).
      x-roles:
        - EXPLORER
        - DOMAIN_EXPERT
      x-fr:
        - FR-13
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewHintInput'
      responses:
        '200':
          description: Hint spoken by the NPC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewHintResult'
        '404':
          $ref: '#/components/responses/NotFound'
      x-screens:
        - E11 Scenario play
        - D05 Play-test
  /runs/{runId}/flags:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags:
        - Play
      operationId: flagContent
      summary: Flag wrong content in an activity
      x-roles:
        - EXPLORER
      x-fr:
        - FR-14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagContentInput'
      responses:
        '201':
          description: Flag received; a domain expert of the occupation is notified
      x-screens:
        - E11 Scenario play
  /runs/{runId}/finish:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags:
        - Play
      operationId: finishRun
      summary: Finish the scenario and get the summary
      description:
        Picks the ending from the total activity score, combines the hidden feedback notes, caps competency points
        and checks the level threshold. If notes are still being drafted, returns 202 and pushes `summary.ready` on the stream.
      x-roles:
        - EXPLORER
        - DOMAIN_EXPERT
      x-fr:
        - FR-08
        - FR-14
        - FR-15
        - FR-18
      x-sd:
        - SD-02
      responses:
        '200':
          description: Scenario summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSummary'
        '202':
          description: Summary pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
      x-screens:
        - E11 Scenario play
        - D05 Play-test
  /runs/{runId}/summary:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags:
        - Play
      operationId: getRunSummary
      summary: Get the result, feedback and guidance of a finished run
      x-roles:
        - EXPLORER
        - DOMAIN_EXPERT
      x-fr:
        - FR-14
      x-sd:
        - SD-02
      responses:
        '200':
          description: Scenario summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSummary'
        '404':
          $ref: '#/components/responses/NotFound'
      x-screens:
        - E12 Scenario summary
        - D05 Play-test
  /side-quests/{sideQuestId}/attempts:
    parameters:
      - name: sideQuestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Play
      operationId: answerSideQuest
      summary: Answer a side quest for bonus points
      x-roles:
        - EXPLORER
      x-fr:
        - FR-16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSideQuestInput'
      responses:
        '201':
          description: Points awarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerSideQuestResult'
        '409':
          $ref: '#/components/responses/Conflict'
      x-screens:
        - E09 Side quest
  /occupations/{occupationId}/ratings:
    parameters:
      - $ref: '#/components/parameters/OccupationId'
    post:
      tags:
        - Feedback
      operationId: rateOccupation
      summary: Rate an occupation after completing every level
      x-roles:
