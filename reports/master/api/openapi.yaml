        - CONTENT_ADMIN
        - SYSTEM_ADMIN
      x-sd:
        - SD-01
        - SD-02
        - SD-05
        - SD-06
        - SD-07
        - SD-09
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
      x-screens:
        - E11 Scenario play
        - E12 Scenario summary
        - C03 Reference data import
        - C06 Gamify workspace
        - C07 Asset library
        - D03 Scenario authoring
        - D05 Play-test
        - D07 Grading reliability
        - A05 Operations monitor
