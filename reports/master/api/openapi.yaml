          type: array
          maxItems: 2
          items:
            type: object
            properties:
              activityKey:
                type: string
              chance:
                type: number
                minimum: 0.1
                maximum: 0.4
              text:
                type: string
              prompt:
                type: string
              targetCompetencyId:
                type: string
                format: uuid
